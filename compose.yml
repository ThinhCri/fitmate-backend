# Docker Compose for Fitmate Backend local/integration.
# Purpose: dev + integration test. NOT for production (see DEC-030 UA-023).
# Containers get auto-prefixed by Compose project name; use --project-name to isolate stacks.
# Required: env_file (.env) with DB_PASSWORD and JWT_SIGNING_KEY. See runbooks/local-dev.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fitmate}
      POSTGRES_USER: ${DB_USER:-fitmate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - fitmate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fitmate} -d ${DB_NAME:-fitmate}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Default port binding removed; verify override (compose.verify300.yml) sets 15432.
    # Production / CI use internal network only via "postgres" hostname.

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    # Default ports removed; verify override (compose.verify300.yml) sets 11025/18025.

  api:
    build:
      context: .
      dockerfile: src/Fitmate.Api/Dockerfile
    image: fitmate-api:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fitmate}
      DB_USER: ${DB_USER:-fitmate}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      # Disable push by default in local so the smoke endpoint stack is simpler; toggle in .env for full E2E.
      FEATURE_PUSH_ENABLED: ${FEATURE_PUSH_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Persist DataProtection key ring across container recreates. See BE-300 plan rev 3 §3.6.
      - fitmate-dpkeys:/home/fitmate/.aspnet/DataProtection-Keys
    ports:
      - "${API_PORT:-8080}:8080"

  # One-shot migration job. Uses bundle image ENTRYPOINT directly (no command override).
  # Run with: docker compose --profile migrate up migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    image: fitmate-migrate:local
    profiles: ["migrate"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fitmate}
      DB_USER: ${DB_USER:-fitmate}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  fitmate-postgres-data:
  fitmate-dpkeys:
