# Docker Compose override for k6 load testing.
# Usage:
#   docker compose -f compose.yml -f compose.loadtest.yml up k6
#
# The k6 container waits for the `api` service to be healthy before running.
# Override BASE_URL with the `api` container hostname when running inside Docker.

services:
  k6:
    image: grafana/k6:latest
    profiles: ["k6"]
    volumes:
      - ./tests/load/scripts:/scripts:ro
    environment:
      BASE_URL: http://api:8080
      # Fail-closed opt-in. A normal compose startup never runs k6 because of
      # the profile, and an explicit k6 run still needs this exact value.
      LOAD_TEST_CONFIRM: ${LOAD_TEST_CONFIRM:-}
      K6_CLOUD_TOKEN: ${K6_CLOUD_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    command: >
      run /scripts/smoke.js
      --out cloud=${K6_CLOUD_TOKEN:+true}
