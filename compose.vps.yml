name: fitmate-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    image: fitmate-migrate:vps
    profiles: ["migrate"]
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: src/Fitmate.Api/Dockerfile
    image: fitmate-api:vps
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DB_HOST: postgres
      DB_PORT: "5432"
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dataprotection-keys:/home/fitmate/.aspnet/DataProtection-Keys
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  dataprotection-keys:
  uploads:
