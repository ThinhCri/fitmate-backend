name: Backend CI

on:
  push:
    branches: [main, 'backend-release/*']
  pull_request:
    branches: [main, 'backend-release/*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  verify:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Fitmate.slnx
      - name: Build
        run: dotnet build Fitmate.slnx --no-restore --configuration Release
      - name: Unit tests
        run: dotnet test tests/Fitmate.UnitTests/Fitmate.UnitTests.csproj --no-build --configuration Release

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitmate_integration_test
          POSTGRES_USER: fitmate
          POSTGRES_PASSWORD: ci-ephemeral-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitmate -d fitmate_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Generate disposable integration signing key
        shell: bash
        run: printf 'JWT_SIGNING_KEY=%s\n' "$(openssl rand -hex 64)" >> "$GITHUB_ENV"
      - name: Integration tests
        run: dotnet test tests/Fitmate.IntegrationTests/Fitmate.IntegrationTests.csproj --configuration Release
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: fitmate
          DB_PASSWORD: ci-ephemeral-db-password
          TEST_DB_NAME: fitmate_integration_test

  images:
    name: Build container images
    runs-on: ubuntu-24.04
    needs: [secrets, verify, integration]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build API image
        run: docker build --file src/Fitmate.Api/Dockerfile --tag fitmate-api:ci .
      - name: Build migration image
        run: docker build --file Dockerfile.migrate --tag fitmate-migrate:ci .

  smoke:
    name: Compose migration and readiness smoke
    runs-on: ubuntu-24.04
    needs: images
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: fitmate-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DB_PASSWORD: ci-ephemeral-db-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare isolated runtime configuration
        shell: bash
        run: |
          key="$(openssl rand -hex 64)"
          {
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'JWT_SIGNING_KEY=%s\n' "$key"
            printf 'ASPNETCORE_ENVIRONMENT=Development\n'
            printf 'FEATURE_PAYMENT_ENABLED=false\nFEATURE_AI_ENABLED=false\nFEATURE_PUSH_ENABLED=false\n'
          } > .env
          chmod 600 .env
      - name: Start database and apply migrations
        run: |
          docker compose -f compose.yml up -d --wait postgres
          docker compose -f compose.yml --profile migrate run --rm migrate
      - name: Start API and check health
        run: |
          docker compose -f compose.yml up -d api
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              curl --fail --silent http://127.0.0.1:8080/health/live
              exit 0
            fi
            sleep 3
          done
          docker compose -f compose.yml logs --no-color api
          exit 1
      - name: Remove isolated CI stack
        if: always()
        run: docker compose -f compose.yml down --volumes --remove-orphans
