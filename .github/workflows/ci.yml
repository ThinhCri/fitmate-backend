name: Backend CI

on:
  push:
    branches: [main, 'backend-release/*']
  pull_request:
    branches: [main, 'backend-release/*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  verify:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Fitmate.slnx
      - name: Build
        run: dotnet build Fitmate.slnx --no-restore --configuration Release
      - name: Unit tests
        run: dotnet test tests/Fitmate.UnitTests/Fitmate.UnitTests.csproj --no-build --configuration Release

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitmate_integration_test
          POSTGRES_USER: fitmate
          POSTGRES_PASSWORD: ci-ephemeral-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitmate -d fitmate_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Integration tests
        run: dotnet test tests/Fitmate.IntegrationTests/Fitmate.IntegrationTests.csproj --configuration Release
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: fitmate
          DB_PASSWORD: ci-ephemeral-db-password
          TEST_DB_NAME: fitmate_integration_test
          JWT_SIGNING_KEY: ci-only-signing-key-never-used-outside-runner-32bytes

  images:
    name: Build container images
    runs-on: ubuntu-24.04
    needs: [secrets, verify, integration]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build API image
        run: docker build --file src/Fitmate.Api/Dockerfile --tag fitmate-api:ci .
      - name: Build migration image
        run: docker build --file Dockerfile.migrate --tag fitmate-migrate:ci .
