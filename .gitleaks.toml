# Fitmate backend — gitleaks config
# Extends default rules + adds Fitmate-specific patterns.
# Version: 8.x compatible (gitleaks/gitleaks-action@v2).

title = "Fitmate Backend"

# Use default gitleaks rules as baseline (catches AWS, GCP, Stripe, GitHub, etc).
extend = { useDefault = true }

# ---------------------------------------------------------------------------
# Custom rules — Fitmate-specific env var keys + secret shapes.
# Only match the VALUE side (after `=` or `:`), not the variable reference.
# ---------------------------------------------------------------------------
[[rules]]
id = "fitmate-jwt-signing-key"
description = "JWT signing key (HS256/HS512). Real keys >= 32 bytes; placeholders match __SET_*__."
# Var assignment with quoted or unquoted value containing >=32 base64-ish chars.
regex = '''(?i)(?:jwt[_-]?signing[_-]?key|jwt[_-]?secret|jwt__signingkey)\s*[:=]\s*["']?([A-Za-z0-9+/=_\-]{32,})["']?'''
keywords = ["jwt_signing_key", "jwt__signingkey", "jwt-signing-key", "jwt_secret", "jwt-secret", "jwtsecret"]
[rules.allowlist]
regexes = [
  '''__SET_[A-Z0-9_]+__''',
  '''ci-dummy-signing-key-not-used-by-unit-tests-32bytes''',
  '''FitmatePerfSuperSecretSigningKeyForBenchmarkingOnly2026!''',
]

[[rules]]
id = "fitmate-db-password"
description = "Postgres / DB password env var (quoted or unquoted value, real secret)."
regex = '''(?i)(?:^|\s)(?:db[_-]password|postgres[_-]password|database[_-]password)\s*[:=]\s*["']?([^\s"'#]{8,})["']?'''
keywords = ["db_password", "postgres_password", "database_password", "db-password", "postgres-password", "database-password"]
[rules.allowlist]
regexes = [
  '''__SET_[A-Z0-9_]+__''',
  '''ci-ephemeral-db-password''',
  '''localverify300pw''',
]

[[rules]]
id = "fitmate-vnpay-secret"
description = "VNPay hash secret + TMN code."
regex = '''(?i)(?:vnpay[_-]?hash[_-]?secret|vnpay[_-]?tmn[_-]?code|vnpay[_-]?secret)\s*[:=]\s*["']?([A-Za-z0-9]{16,})["']?'''
keywords = ["vnpay_hash_secret", "vnpay_tmn_code", "vnpay-hash-secret", "vnpay-tmn-code", "vnpay_secret", "vnpay-secret"]
[rules.allowlist]
regexes = [
  '''__SET_VNPAY[A-Z0-9_]+__''',
]

[[rules]]
id = "fitmate-smtp-password"
description = "SMTP password / app password."
regex = '''(?i)(?:^|\s)(?:smtp[_-]?password|smtp[_-]?pass|mail[_-]?password)\s*[:=]\s*["']?([^\s"'#]{6,})["']?'''
keywords = ["smtp_password", "smtp_pass", "mail_password", "smtp-password", "smtp-pass", "mail-password"]
[rules.allowlist]
regexes = [
  '''__SET_[A-Z0-9_]+__''',
]

[[rules]]
id = "fitmate-storage-credentials"
description = "Storage adapter credentials / signed URL secret."
regex = '''(?i)(?:storage[_-]?(?:access[_-]?key|secret[_-]?key|client[_-]?secret)|signed[_-]?url[_-]?secret)\s*[:=]\s*["']?([A-Za-z0-9+/=_\-]{16,})["']?'''
keywords = ["storage_access_key", "storage_secret_key", "signed_url_secret", "storage-access-key", "storage-secret-key", "signed-url-secret"]

[[rules]]
id = "fitmate-bootstrap-admin-secret"
description = "Bootstrap admin password or token (high entropy only)."
regex = '''(?i)(?:bootstrap[_-]?admin[_-]?(?:password|token|secret)|admin[_-]?bootstrap[_-]?(?:password|token))\s*[:=]\s*["']?([A-Za-z0-9@#$%^&+=_\-]{12,})["']?'''
keywords = ["bootstrap_admin_password", "admin_bootstrap_password", "bootstrap-admin-password", "admin-bootstrap-password"]

# ---------------------------------------------------------------------------
# Allowlist — only build artifacts and meta files. All documentation and env files are scanned.
# ---------------------------------------------------------------------------
[allowlist]
description = "Allowlist build artifacts, package managers and meta configs."
paths = [
  '''\.gitleaks\.toml$''',
  '''node_modules/''',
  '''bin/''',
  '''obj/''',
  '''out/''',
  '''\.git/''',
  '''tests/load/.*\.json$''',
  '''\.gitignore$''',
]

# Allow placeholder syntax `__SET_*__` and known demo values anywhere.
regexes = [
  '''__SET_[A-Z0-9_]+__''',
  '''supersecret12345''',
  '''ci-dummy-signing-key-not-used-by-unit-tests-32bytes''',
  '''ci-ephemeral-db-password''',
  '''user@fitmate\.vn''',
  '''pt@fitmate\.vn''',
  '''member@fitmate\.vn''',
  '''admin@fitmate\.vn''',
  '''admin@fitmate\.local''',
  '''test@example\.com''',
  '''noreply@fitmate\.vn''',
  # Exact public test vectors, local-only test values and immutable evidence.
  # Keep these value-scoped: never allowlist their containing source/docs paths.
  '''VNPAYTESTSECRETKEY1234567890ABCDEF1234567890ABCDEF1234567890ABCDEF''',
  '''VNPAYINTEGRATIONTESTSECRETKEY1234567890ABCDEF1234567890ABCDEF''',
  '''1a54716c8f0efb2744fb28b6e38b25da7f67a925d98bc1c18bd8faaecadd7675''',
  '''3B2E624616A3999DDDC4288E430866C8CD236F0E70430B22541B1556AF4496F6''',
  '''fitmate-api:1\.0\.0-previous''',
]

stopwords = [
  "placeholder",
  "example",
  "TODO",
  "FIXME",
  "DEMO",
]
