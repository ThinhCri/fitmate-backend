        - in: query
          name: memberId
          schema:
            type: string
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
          default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
