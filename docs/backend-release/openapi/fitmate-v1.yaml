openapi: 3.1.0
info:
  title: Fitmate API v1
  description: |
    Source of truth cho Android app + Admin Web.
    Quy ước: xem docs/backend-release/api-contract.md.
  version: 1.0.0
  contact:
    name: Fitmate Backend
    url: https://docs.fitmate.vn
servers:
  - url: https://api.fitmate.vn/api/v1
    description: Production
  - url: https://staging-api.fitmate.vn/api/v1
    description: Staging
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Auth
  - name: Users
  - name: Trainers
  - name: Certificates
  - name: Availability
  - name: Services
  - name: Bookings
  - name: Payments
  - name: Finance
  - name: Workout
  - name: Nutrition
  - name: Social
  - name: Chat
  - name: Notifications
  - name: Moderation
  - name: Admin

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register member or PT
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            Set-Cookie:
              description: refresh_token HttpOnly Secure SameSite=Lax
              schema:
                type: string
        '202':
          description: |
            Admin password accepted but a second factor is required. No access token is
            issued in this response; the caller must complete the challenge.
            - mfaRequired: complete the challenge with POST /admin/auth/login/verify.
            - mfaSetupRequired: first-time MFA enrolment; the setup token is only valid
              for POST /admin/auth/mfa/setup and /admin/auth/mfa/verify.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [mfaRequired, challengeId, expiresIn]
                    properties:
                      mfaRequired:
                        type: boolean
                        enum: [true]
                      challengeId:
                        type: string
                      expiresIn:
                        type: integer
                        description: Challenge TTL in seconds (300).
                  - type: object
                    required: [mfaSetupRequired, setupToken]
                    properties:
                      mfaSetupRequired:
                        type: boolean
                        enum: [true]
                      setupToken:
                        type: string
        '401':
          description: Sai email hoặc password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Tài khoản bị khóa hoặc đang chờ xóa (PendingDeletion)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/auth/login/verify:
    post:
      tags: [Auth]
      summary: Complete an admin login MFA challenge
      description: |
        Single-use challenge. Consuming it issues a normal session for the web client.
        A challenge is valid for 5 minutes and at most 5 verification attempts; an
        exhausted or expired challenge is rejected and cannot be replayed.
      operationId: verifyAdminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId:
                  type: string
                code:
                  type: string
                  description: 6-digit TOTP, or a recovery code when useRecoveryCode is true.
                useRecoveryCode:
                  type: boolean
                  default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            Set-Cookie:
              description: refresh_token HttpOnly Secure SameSite=Lax
              schema:
                type: string
        '400':
          description: Malformed code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Challenge invalid, expired, already consumed, or attempts exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Client is not allowed to use cookie auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke session hiện tại)
      operationId: logout
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Gửi email reset password
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Email đã được gửi nếu user tồn tại
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset password với token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '204':
          description: No Content
        '400':
          description: Token không hợp lệ hoặc password yếu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: Token đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/password/change:
    post:
      tags: [Auth]
      summary: Đổi password (yêu cầu current password)
      operationId: authChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags: [Users]
      summary: Lấy profile của user hiện tại
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: Cập nhật profile
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Xóa tài khoản (yêu cầu xác nhận password)
      operationId: deleteMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_confirmation]
              properties:
                password_confirmation:
                  type: string
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/password:
    post:
      tags: [Users]
      summary: Đổi password (yêu cầu current password)
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/devices:
    post:
      tags: [Users]
      summary: Register push device token
      operationId: registerDevice
      description: |
        Registers or refreshes a device token for push delivery.
        Idempotent: re-registering the same token updates the last_used_at timestamp.
        The token is stored encrypted (DataProtection) and never echoed back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_token, platform, provider]
              properties:
                device_token:
                  type: string
                  minLength: 32
                  maxLength: 4096
                  description: Raw push token from FCM / Expo Push API. Never stored in plain text.
                  example: "fcm:dQw4w9WgXcQ:APA91bH..."
                platform:
                  type: string
                  enum: [android, ios, web]
                provider:
                  type: string
                  enum: [fcm, expo]
      responses:
        '200':
          description: Device registered or refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegistrationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /users/me/devices/{id}:
    delete:
      tags: [Users]
      summary: Revoke a device
      operationId: revokeDevice
      description: Soft-revokes a device so it stops receiving push notifications.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Device revoked

  /trainers:
    get:
      tags: [Trainers]
      summary: Danh sách PT (marketplace)
      operationId: listTrainers
      parameters:
        - in: query
          name: specialty
          schema:
            type: string
        - in: query
          name: minPriceVnd
          schema:
            type: integer
            minimum: 0
        - in: query
          name: maxPriceVnd
          schema:
            type: integer
            minimum: 0
        - in: query
          name: minRating
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 5
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PTPublicProfile'
                  nextCursor:
                    type: string
                    nullable: true

  /trainers/{id}:
    get:
      tags: [Trainers]
      summary: Chi tiết PT (verified only)
      operationId: getTrainer
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTPublicDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /trainers/{id}/availability:
    get:
      tags: [Availability]
      summary: Lấy slot khả dụng của PT
      operationId: getTrainerAvailability
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilitySlot'

  /me/availability:
    get:
      tags: [Availability]
      summary: PT xem lịch khả dụng authoritative (gồm Open, Held, Booked) trong range
      operationId: getMyAvailability
      parameters:
        - name: from
          in: query
          required: true
          description: UTC ISO-8601 start boundary
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: UTC ISO-8601 end boundary
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilitySlot'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Availability]
      summary: PT cập nhật lịch khả dụng (scoped replace khi có from/to, hoặc global replace khi không truyền)
      operationId: setMyAvailability
      parameters:
        - name: from
          in: query
          required: false
          description: Optional UTC ISO-8601 start boundary for scoped replace
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Optional UTC ISO-8601 end boundary for scoped replace
          schema:
            type: string
            format: date-time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  items:
                    $ref: '#/components/schemas/AvailabilitySlotInput'
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
      responses:
        '204':
          description: No Content
        '400':
          description: Slot trùng / không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Slot trùng lặp hoặc trùng lịch Held/Booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /me/certificates:
    get:
      tags: [Certificates]
      summary: Danh sách chứng chỉ của PT hiện tại
      operationId: listMyCertificates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Certificate'
    post:
      tags: [Certificates]
      summary: PT gửi chứng chỉ mới (status=pending)
      operationId: submitCertificate
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title, issued_by, code, issue_date]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                issued_by:
                  type: string
                code:
                  type: string
                issue_date:
                  type: string
                  format: date
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        '400':
          $ref: '#/components/responses/ValidationError'

  /me/services:
    get:
      tags: [Services]
      summary: Danh sách dịch vụ của PT
      operationId: listMyServices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
    post:
      tags: [Services]
      summary: Tạo dịch vụ mới
      operationId: createService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'

  /me/services/{id}:
    patch:
      tags: [Services]
      summary: Cập nhật dịch vụ
      operationId: updateService
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '409':
          description: Có booking pending không thể sửa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags: [Services]
      summary: Xóa dịch vụ (soft delete nếu có booking lịch sử)
      operationId: deleteService
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: No Content

  /bookings/holds:
    post:
      tags: [Bookings]
      summary: Giữ chỗ tạm thời (TTL 5 phút)
      operationId: createBookingHold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pt_id, service_id, slot_start_utc]
              properties:
                pt_id:
                  type: string
                service_id:
                  type: string
                slot_start_utc:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingHold'
        '409':
          description: Slot đã được giữ / book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /bookings/confirm:
    post:
      tags: [Bookings]
      summary: Xác nhận booking sau khi thanh toán
      operationId: confirmBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hold_id, payment_id]
              properties:
                hold_id:
                  type: string
                payment_id:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '402':
          description: Payment chưa thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: Hold đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /me/bookings:
    get:
      tags: [Bookings]
      summary: Danh sách booking của member
      operationId: listMyBookings
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/AppointmentStatus'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer

  /me/trainer-bookings:
    get:
      tags: [Bookings]
      summary: Danh sách booking mà PT nhận
      operationId: listMyTrainerBookings
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/AppointmentStatus'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'
                  total:
                    type: integer

  /me/bookings/{id}/cancel:
    post:
      tags: [Bookings]
      summary: Member/PT hủy booking
      operationId: cancelMyBooking
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 5
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '409':
          description: Booking đã completed hoặc đang refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /me/bookings/{id}/reschedule:
    post:
      tags: [Bookings]
      summary: Đổi slot booking (Bãi bỏ - 410 Gone)
      description: Endpoint này đã bị bãi bỏ theo DEC-051 và Reschedule Branch A (BR-05). Luôn trả về HTTP 410 Gone. Sử dụng luồng đề xuất đổi lịch qua /me/bookings/{id}/reschedule-requests.
      operationId: rescheduleMyBooking
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '410':
          description: Endpoint đã bị bãi bỏ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /me/bookings/{id}/complete:
    post:
      tags: [Bookings]
      summary: PT xác nhận hoàn thành booking
      operationId: completeMyBooking
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '403':
          description: Không phải PT của booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /payments:
    post:
      tags: [Payments]
      summary: Tạo payment intent
      operationId: createPayment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hold_id, method]
              properties:
                hold_id:
                  type: string
                method:
                  type: string
                  enum: [vnpay, payos]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /payments/vnpay/return:
    get:
      tags: [Payments]
      summary: VNPay return URL (user redirect)
      operationId: vnpayReturn
      security: []
      parameters:
        - in: query
          name: vnp_SecureHash
          schema:
            type: string
        - in: query
