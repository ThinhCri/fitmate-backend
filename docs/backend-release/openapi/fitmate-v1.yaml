          minimum: 1
          maximum: 5
        text:
          type: string
        created_at:
          type: string
          format: date-time

    PlatformPolicyResponse:
      type: object
      description: |
        Theo DEC-029 — read-only platform policy. Đơn vị platform_fee_rate_bps:
        1000 bps = 10.00%. FE convert sang phần trăm để hiển thị.
      properties:
        platform_fee_rate_bps:
          type: integer
          example: 1000
        policy_version:
          type: string
          example: v1
        effective_from:
          type: string
          format: date-time
        display_hint:
          type: string
          example: "10.00% — cố định, chưa hỗ trợ chỉnh từ admin trong release đầu"
        editable:
          type: boolean
          example: false

    BookingRescheduleEvent:
      type: object
      description: |
        Theo DEC-026 — sự kiện đổi lịch có audit. KHÔNG phải trạng thái kết thúc.
        Booking có previous_booking_id trỏ về event này.
      properties:
        id:
          type: string
        booking_id:
          type: string
        requested_by:
          type: string
        requested_at:
          type: string
          format: date-time
        old_slot_start_utc:
          type: string
          format: date-time
        new_slot_start_utc:
          type: string
          format: date-time
        accepted_by:
          type: string
          nullable: true
        accepted_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [Pending, Accepted, Rejected, Cancelled]
        reason:
          type: string
          nullable: true

