openapi: 3.0.3
info:
  title: Fitmate API v1
  description: |
    Source of truth cho Android app + Admin Web.
    Quy ước: xem docs/backend-release/api-contract.md.
    Contract status: FROZEN-V1 (BE-801) - 2026-10-02.
    Route/schema/unit contract verification và 61/61 HTTP integration tests trên PostgreSQL cô lập đã pass. Mobile App được phép generate client từ revision được ghi trong evidence BE-801.
  version: 1.0.0
  contact:
    name: Fitmate Backend
    url: https://docs.fitmate.vn
servers:
  - url: https://api.fitmate.vn/api/v1
    description: Production
  - url: https://staging-api.fitmate.vn/api/v1
    description: Staging
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Auth
  - name: Users
  - name: Trainers
  - name: Certificates
  - name: Availability
  - name: Services
  - name: Bookings
  - name: Payments
  - name: Finance
  - name: Workout
  - name: Nutrition
  - name: Social
  - name: Chat
  - name: Notifications
  - name: Moderation
  - name: Admin

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register member or PT
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPendingResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            Set-Cookie:
              description: refresh_token HttpOnly Secure SameSite=Lax
              schema:
                type: string
        '202':
          description: |
            Admin password accepted but a second factor is required. No access token is
            issued in this response; the caller must complete the challenge.
            - mfaRequired: complete the challenge with POST /admin/auth/login/verify.
            - mfaSetupRequired: first-time MFA enrolment; the setup token is only valid
              for POST /admin/auth/mfa/setup and /admin/auth/mfa/verify.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [mfaRequired, challengeId, expiresIn]
                    properties:
                      mfaRequired:
                        type: boolean
                        enum: [true]
                      challengeId:
                        type: string
                      expiresIn:
                        type: integer
                        description: Challenge TTL in seconds (300).
                  - type: object
                    required: [mfaSetupRequired, setupToken]
                    properties:
                      mfaSetupRequired:
                        type: boolean
                        enum: [true]
                      setupToken:
                        type: string
        '401':
          description: Sai email hoặc password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Tài khoản bị khóa, đang chờ xóa, hoặc chưa xác minh email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/auth/login/verify:
    post:
      tags: [Auth]
      summary: Complete an admin login MFA challenge
      description: |
        Single-use challenge. Consuming it issues a normal session for the web client.
        A challenge is valid for 5 minutes and at most 5 verification attempts; an
        exhausted or expired challenge is rejected and cannot be replayed.
      operationId: verifyAdminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId:
                  type: string
                code:
                  type: string
                  description: 6-digit TOTP, or a recovery code when useRecoveryCode is true.
                useRecoveryCode:
                  type: boolean
                  default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            Set-Cookie:
              description: refresh_token HttpOnly Secure SameSite=Lax
              schema:
                type: string
        '400':
          description: Malformed code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Challenge invalid, expired, already consumed, or attempts exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Client is not allowed to use cookie auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke session hiện tại)
      operationId: logout
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Gửi email reset password
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Email đã được gửi nếu user tồn tại
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/email/verify:
    post:
      tags: [Auth]
      summary: Xác minh email bằng mã OTP 6 chữ số
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Email đã được xác minh
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Mã không hợp lệ, hết hạn hoặc đã sử dụng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/email/resend:
    post:
      tags: [Auth]
      summary: Gửi lại mã xác minh email
      operationId: resendEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
      responses:
        '202':
          description: Phản hồi trung lập, không tiết lộ tài khoản tồn tại
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Đặt lại mật khẩu bằng mã email 6 chữ số
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password, email]
              properties:
                token:
                  type: string
                  pattern: '^[0-9]{6}$'
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: No Content
        '400':
          description: Mã không hợp lệ hoặc mật khẩu yếu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: Token đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/password/change:
    post:
      tags: [Auth]
      summary: Đổi password (yêu cầu current password)
      operationId: authChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags: [Users]
      summary: Lấy profile của user hiện tại
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: Cập nhật profile
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Users]
      summary: Cập nhật profile (PUT alias)
      operationId: putMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Gửi yêu cầu xóa tài khoản bằng OTP email (alias cũ)
      operationId: deleteMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '200':
          description: Yêu cầu đang chờ quản trị viên xử lý
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountDeletionStatus'}
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Tài khoản không thể yêu cầu xóa
        '409':
          description: Còn lịch hẹn hoặc nghĩa vụ tài chính chưa hoàn tất
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/avatar:
    put:
      tags: [Users]
      summary: Gắn ảnh đại diện đã tải lên vào tài khoản hiện tại
      operationId: attachMyAvatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachAvatarRequest'
      responses:
        '200':
          description: Hồ sơ với URL đọc ảnh mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/auth/mfa/status:
    get:
      tags: [Admin]
      summary: Lấy trạng thái MFA của admin
      operationId: getAdminMfaStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }

  /admin/auth/mfa/setup:
    post:
      tags: [Admin]
      summary: Khởi tạo thiết lập MFA
      operationId: setupAdminMfa
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  shared_key: { type: string }
                  authenticator_uri: { type: string }

  /admin/auth/mfa/verify:
    post:
      tags: [Admin]
      summary: Xác minh và kích hoạt MFA
      operationId: verifyAdminMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  recovery_codes:
                    type: array
                    items: { type: string }

  /admin/auth/mfa/disable:
    post:
      tags: [Admin]
      summary: Tắt MFA cho admin
      operationId: disableAdminMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codeOrPassword]
              properties:
                codeOrPassword: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /users/me/password:
    post:
      tags: [Users]
      summary: Đổi password (yêu cầu current password)
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/devices:
    post:
      tags: [Users]
      summary: Register push device token
      operationId: registerDevice
      description: |
        Registers or refreshes a device token for push delivery.
        Idempotent: re-registering the same token updates the last_used_at timestamp.
        The token is stored encrypted (DataProtection) and never echoed back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_token, platform, provider]
              properties:
                device_token:
                  type: string
                  minLength: 32
                  maxLength: 4096
                  description: Raw push token from FCM / Expo Push API. Never stored in plain text.
                  example: "fcm:dQw4w9WgXcQ:APA91bH..."
                platform:
                  type: string
                  enum: [android, ios, web]
                provider:
                  type: string
                  enum: [fcm, expo]
      responses:
        '200':
          description: Device registered or refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegistrationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /users/me/devices/{id}:
    delete:
      tags: [Users]
      summary: Revoke a device
      operationId: revokeDevice
      description: Soft-revokes a device so it stops receiving push notifications.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Device revoked

  /users/{id}/profile:
    get:
      tags: [Users]
      summary: Lấy thông tin public profile của người dùng
      operationId: getPublicProfile
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/search:
    get:
      tags: [Users]
      summary: Tìm kiếm người dùng theo tên hoặc email
      operationId: searchUsers
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicUserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/suggestions:
    get:
      tags: [Users]
      summary: Gợi ý kết bạn, loại trừ bản thân, bạn bè, lời mời đang chờ và người bị chặn
      operationId: listSuggestedUsers
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicUserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/preferences:
    get:
      tags: [Users]
      summary: Lấy cài đặt tùy chọn cá nhân của người dùng
      operationId: getUserPreferences
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Users]
      summary: Cập nhật cài đặt tùy chọn cá nhân của người dùng
      operationId: updateUserPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferencesRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/deletion-otp:
    post:
      tags: [Users]
      summary: Gửi OTP email trước khi yêu cầu xóa tài khoản
      description: Mã dùng một lần trong 5 phút, tối đa 5 lần nhập sai; gửi lại sau 60 giây. Không tạo yêu cầu xóa.
      operationId: sendAccountDeletionOtp
      responses:
        '200':
          description: OTP đã được đưa vào hàng đợi email
          content:
            application/json:
              schema:
                type: object
                required: [expires_at, resend_after_seconds]
                properties:
                  expires_at: { type: string, format: date-time }
                  resend_after_seconds: { type: integer, example: 60 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Tài khoản không hoạt động hoặc không có email
        '409':
          description: Đã có yêu cầu xóa đang chờ xử lý
        '429':
          description: Chưa hết thời gian chờ gửi lại mã

  /users/me/delete-request:
    post:
      tags: [Users]
      summary: Xác thực OTP email và gửi yêu cầu xóa cho quản trị viên
      operationId: requestAccountDeletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/deletion-status:
    get:
      tags: [Users]
      summary: Kiểm tra trạng thái xóa tài khoản
      operationId: getAccountDeletionStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/cancel-deletion:
    post:
      tags: [Users]
      summary: Hủy yêu cầu xóa tài khoản trong thời gian chờ
      operationId: cancelAccountDeletion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/export:
    post:
      tags: [Users]
      summary: Yêu cầu xuất dữ liệu cá nhân (GDPR/privacy compliance)
      operationId: exportUserData
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDataExport'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /public/account-deletion-request:
    post:
      tags: [Users]
      summary: Yêu cầu xóa tài khoản công khai (cho store listing policy)
      operationId: publicAccountDeletionRequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicAccountDeletionRequest'
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/ValidationError'

  /public/account-deletion-confirm:
    post:
      tags: [Users]
      summary: Xác nhận xóa tài khoản bằng token từ email
      operationId: publicAccountDeletionConfirm
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicAccountDeletionConfirm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionStatus'
        '400':
          $ref: '#/components/responses/ValidationError'

  /trainers:
    get:
      tags: [Trainers]
      summary: Danh sách PT (marketplace)
      operationId: listTrainers
      security: []
      parameters:
        - in: query
          name: specialty
          schema:
            type: string
        - in: query
          name: minPriceVnd
          schema:
            type: integer
            minimum: 0
        - in: query
          name: maxPriceVnd
          schema:
            type: integer
            minimum: 0
        - in: query
          name: minRating
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 5
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PTPublicProfile'
                  nextCursor:
                    type: string
                    nullable: true

  /trainers/{ptUserId}:
    get:
      tags: [Trainers]
      summary: Chi tiết PT (verified only)
      operationId: getTrainer
      security: []
      parameters:
        - in: path
          name: ptUserId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTPublicDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /trainers/{ptId}/availability:
    get:
      tags: [Availability]
      summary: Lấy slot khả dụng của PT
      operationId: getTrainerAvailability
      security: []
      parameters:
        - in: path
          name: ptId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilitySlot'

  /trainers/{id}/reviews:
    post:
      tags: [Trainers]
      summary: Đánh giá huấn luyện viên (PT)
      operationId: submitTrainerReview
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerReview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Trainers]
      summary: Xem danh sách đánh giá của huấn luyện viên (PT)
      operationId: getTrainerReviews
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerReviewsSummary'

  /me/availability:
    get:
      tags: [Availability]
      summary: PT xem lịch khả dụng authoritative (gồm Open, Held, Booked) trong range
      operationId: getMyAvailability
      parameters:
        - name: from
          in: query
          required: true
          description: UTC ISO-8601 start boundary
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: UTC ISO-8601 end boundary
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilitySlot'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Availability]
      summary: PT cập nhật lịch khả dụng (scoped replace khi có from/to, hoặc global replace khi không truyền)
      operationId: setMyAvailability
      parameters:
        - name: from
          in: query
          required: false
          description: Optional UTC ISO-8601 start boundary for scoped replace
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Optional UTC ISO-8601 end boundary for scoped replace
          schema:
            type: string
            format: date-time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  items:
                    $ref: '#/components/schemas/AvailabilitySlotInput'
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
      responses:
        '204':
          description: No Content
        '400':
          description: Slot trùng / không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Slot trùng lặp hoặc trùng lịch Held/Booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /me/phone/verification:
    post:
      tags: [Trainers]
      summary: PT yêu cầu mã SMS xác minh số điện thoại
      operationId: startPtPhoneVerification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number]
              properties:
                phone_number: {type: string, pattern: '^\+84[1-9][0-9]{8}$'}
      responses:
        '202':
          description: Mã đã được đưa vào outbox để gửi; chưa xác minh số điện thoại
          content:
            application/json:
              schema:
                type: object
                required: [expires_at_utc, retry_after_seconds]
                properties:
                  expires_at_utc: {type: string, format: date-time}
                  retry_after_seconds: {type: integer}
        '400': {description: Số điện thoại không hợp lệ}
        '401': {description: Chưa đăng nhập}
        '403': {description: Không phải PT hoặc tài khoản không hợp lệ}
        '409': {description: Số điện thoại đã dùng hoặc đã xác minh}
        '429': {description: Gửi lại quá nhanh}
        '503': {description: Chưa cấu hình nhà cung cấp SMS}

  /me/phone/verification/confirm:
    post:
      tags: [Trainers]
      summary: PT xác nhận mã SMS một lần
      operationId: confirmPtPhoneVerification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, pattern: '^[0-9]{6}$'}
      responses:
        '204': {description: Số điện thoại đã xác minh}
        '400': {description: 'Mã sai, hết hạn hoặc đã dùng'}
        '401': {description: Chưa đăng nhập}
        '403': {description: 'Không phải PT hoặc tài khoản không hợp lệ'}

  /me/certificates:
    get:
      tags: [Certificates]
      summary: Danh sách chứng chỉ của PT hiện tại
      operationId: listMyCertificates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Certificate'
    post:
      tags: [Certificates]
      summary: PT gửi chứng chỉ mới (status=pending)
      operationId: submitCertificate
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title, issued_by, code, issue_date]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                issued_by:
                  type: string
                code:
                  type: string
                issue_date:
                  type: string
                  format: date
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        '400':
          $ref: '#/components/responses/ValidationError'

  /me/integrations/google-meet:
    get:
      tags: [Services]
      summary: PT kiểm tra trạng thái kết nối Google Meet
      operationId: getMyGoogleMeetConnection
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Trạng thái kết nối
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Services]
      summary: PT ngắt kết nối Google Meet; lịch đã bán giữ link riêng
      operationId: disconnectMyGoogleMeet
      security:
        - bearerAuth: []
      responses:
        '204': { description: Đã ngắt kết nối }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/integrations/google-meet/authorization:
    post:
      tags: [Services]
      summary: Tạo URL OAuth một lần để PT kết nối Google Meet
      operationId: authorizeMyGoogleMeet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: URL OAuth
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorization_url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: Chưa cấu hình Google OAuth }

  /integrations/google-meet/callback:
    get:
      tags: [Services]
      summary: Google OAuth redirect; xác thực state một lần phía server
      operationId: completeGoogleMeetAuthorization
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '200': { description: Trang HTML kết nối thành công }
        '400': { $ref: '#/components/responses/ValidationError' }

  /me/services:
    get:
      tags: [Services]
      summary: Danh sách dịch vụ của PT
      operationId: listMyServices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
    post:
      tags: [Services]
      summary: Tạo dịch vụ mới
      operationId: createService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'

  /me/services/{id}:
    get:
      tags: [Services]
      summary: Chi tiết dịch vụ
      operationId: getMyService
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Services]
      summary: Cập nhật dịch vụ
      operationId: updateService
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '409':
          description: Có booking pending không thể sửa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags: [Services]
      summary: Xóa dịch vụ (soft delete nếu có booking lịch sử)
      operationId: deleteService
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: No Content

  /me/session-packages:
    get:
      tags: [Bookings]
      summary: Danh sách gói PT của hội viên hiện tại (chỉ đọc)
      operationId: listMySessionPackages
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Gói của người gọi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionPackagePage'}
        '400': {description: Trang hoặc kích thước trang không hợp lệ}
        '401': {description: Chưa đăng nhập}

  /me/session-packages/holds:
    post:
      tags: [Bookings]
      summary: Hold four or eight PT sessions atomically for ten minutes
      operationId: createMySessionPackageHold
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pt_user_id, service_id, delivery_mode, slot_starts_utc]
              properties:
                pt_user_id: {type: string, format: uuid}
                service_id: {type: string, format: uuid}
                delivery_mode: {type: string, enum: [in_person, online]}
                slot_starts_utc:
                  type: array
                  items: {type: string, format: date-time}
                  minItems: 4
                  maxItems: 8
      responses:
        '201':
          description: Package reservations held
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionPackage'}
        '400': {description: Invalid slots or mode}
        '401': {description: Authentication required}
        '404': {description: PT service or slot unavailable}
        '409': {description: One or more slots already held or booked}
        '503': {description: Google Meet unavailable for online package}

  /me/session-packages/assigned:
    get:
      tags: [Bookings]
      summary: Danh sách gói PT được phân công (chỉ đọc)
      operationId: listAssignedPtSessionPackages
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Gói của PT hiện tại
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionPackagePage'}
        '400': {description: Trang hoặc kích thước trang không hợp lệ}
        '401': {description: Chưa đăng nhập}
        '403': {description: Không có quyền PT}

  /me/session-packages/{id}:
    get:
      tags: [Bookings]
      summary: Chi tiết gói PT cho hội viên hoặc PT liên quan (chỉ đọc)
      operationId: getMySessionPackage
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Gói và trạng thái hiện tại của từng buổi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionPackage'}
        '401': {description: Chưa đăng nhập}
        '404': {description: Gói không tồn tại hoặc không thuộc người gọi}
        '409': {description: Dữ liệu gói cần đối soát}

  /me/session-packages/{id}/payment-requests:
    post:
      tags: [Payments]
      summary: Create one payOS payment for an active package hold
      operationId: createMySessionPackagePayment
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acknowledge_short_notice]
              properties:
                acknowledge_short_notice: {type: boolean}
      responses:
        '200':
          description: Payment request; redirect is not payment confirmation
          content:
            application/json:
              schema:
                type: object
                required: [package_id, payment_id, amount_vnd, status]
                properties:
                  package_id: {type: string, format: uuid}
                  payment_id: {type: string, format: uuid}
                  amount_vnd: {type: integer, format: int64}
                  status: {type: string}
                  redirect_url: {type: string, nullable: true}
        '400': {description: Invalid request or short-notice acknowledgment missing}
        '401': {description: Authentication required}
        '404': {description: Package not owned by caller}
        '409': {description: Package hold expired or payment already settled}
        '503': {description: payOS is not configured}

  /me/session-packages/{id}/stop-requests:
    post:
      tags: [Bookings]
      summary: Hội viên yêu cầu dừng gói đang hoạt động
      description: Lý do và báo giá vừa được hội viên xem là bắt buộc. Backend tính lại dưới khóa giao dịch; nếu báo giá đã đổi, trả 409 để hội viên xem lại. PT có 24 giờ để phản hồi. Tiền chưa được chuyển ở bước này.
      operationId: requestMySessionPackageStop
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, expected_refund_quote_vnd]
              properties:
                reason: {type: string, minLength: 10, maxLength: 1000}
                expected_refund_quote_vnd: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Yêu cầu đang chờ PT; báo giá hoàn tiền đã chốt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionPackageStop'}
        '400': {description: Thiếu khóa chống gửi trùng hoặc lý do không hợp lệ}
        '401': {description: Chưa đăng nhập}
        '404': {description: Không phải chủ gói}
        '409': {description: 'Báo giá đã đổi, gói hoặc khoản tài chính không đủ điều kiện'}

  /me/session-packages/{id}/stop-preview:
    get:
      tags: [Bookings]
      summary: Xem trước số tiền dự kiến hoàn khi dừng gói
      description: Chỉ chủ gói xem được. Đây là ước tính tại thời điểm đọc; trạng thái buổi tập và mốc 48 giờ có thể thay đổi. POST yêu cầu dừng sẽ kiểm tra lại và chốt snapshot có thẩm quyền.
      operationId: previewMySessionPackageStop
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Ước tính hoàn tiền cho từng buổi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionPackageStopPreview'}
        '401': {description: Chưa đăng nhập}
        '404': {description: Không phải chủ gói}
        '409': {description: Gói hoặc dữ liệu tài chính chưa đủ điều kiện}

  /me/session-packages/{id}/stop-requests/accept:
    post:
      tags: [Bookings]
      summary: PT đồng ý yêu cầu dừng gói đang chờ
      description: Chỉ PT được phân công có thể đồng ý. Hệ thống hoàn tất dừng gói và tạo yêu cầu chuyển hoàn thủ công; PT không tự chuyển tiền.
      operationId: acceptAssignedSessionPackageStop
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      responses:
        '200':
          description: Yêu cầu đã được duyệt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionPackageStop'}
        '400': {description: Thiếu khóa chống gửi trùng}
        '401': {description: Chưa đăng nhập}
        '403': {description: Không có quyền PT}
        '404': {description: Không phải PT được phân công}
        '409': {description: Không có yêu cầu đang chờ}

  /me/session-packages/{id}/stop-requests/{requestId}/withdraw:
    post:
      tags: [Bookings]
      summary: Hội viên rút yêu cầu dừng trước khi được duyệt
      operationId: withdrawMySessionPackageStop
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      responses:
        '200':
          description: Yêu cầu đã rút; gói trở lại trạng thái hoạt động
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionPackageStop'}
        '400': {description: Thiếu khóa chống gửi trùng}
        '401': {description: Chưa đăng nhập}
        '404': {description: Không phải chủ gói hoặc không có yêu cầu}
        '409': {description: Yêu cầu đã được duyệt hoặc quá hạn rút}

  /bookings/holds:
    post:
      tags: [Bookings]
      summary: Giữ chỗ tạm thời (TTL 10 phút)
      description: Chỉ giữ giờ PT đã công bố, dịch vụ active và PT đủ điều kiện. Buổi tập phải bắt đầu sau ít nhất 30 phút; PT không tự đặt dịch vụ của mình.
      operationId: createBookingHold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pt_id, service_id, slot_start_utc]
              properties:
                pt_id:
                  type: string
                  format: uuid
                service_id:
                  type: string
                  format: uuid
                slot_start_utc:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBookingHoldResponse'
        '400':
          description: Thời điểm UTC không hợp lệ hoặc quá sát giờ
        '404':
          description: Dịch vụ/giờ công bố không còn nhận đặt
        '409':
          description: Slot đã được giữ / book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /bookings/holds/{id}:
    get:
      tags: [Bookings]
      summary: Lookup hold (Owner-scoped) kiểm tra TTL trước khi thanh toán
      operationId: getBookingHold
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingHoldStatusResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/{id}/confirm:
    post:
      tags: [Bookings]
      summary: Legacy PT confirmation; verified payment now confirms automatically
      deprecated: true
      operationId: confirmBookingById
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/bookings/{id}:
    get:
      tags: [Bookings]
