        id:
          type: string
        plan_id:
          type: string
          nullable: true
        plan_name:
          type: string
          nullable: true
        date:
          type: string
          format: date
        day:
          type: string
        duration_min:
          type: integer
        calories_burned:
          type: integer
        exercises:
          type: integer
        status:
          type: string
          enum: [completed, ended_early, skipped]
        completed_sets:
          type: integer
          nullable: true
        planned_sets:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutSessionExerciseView'

    WorkoutSessionExerciseInput:
      type: object
      required: [exercise_id, order_index]
      properties:
        exercise_id:
          type: string
        order_index:
          type: integer
        planned_reps:
          type: integer
        planned_duration_sec:
          type: integer
        planned_rest_sec:
          type: integer
        sets:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutSetInput'

    WorkoutSessionExerciseView:
      type: object
      properties:
        id:
          type: string
        exercise_name:
          type: string
        type:
          type: string
          enum: [reps, time]
        order_index:
          type: integer
        planned_sets:
          type: integer
        planned_reps:
          type: integer
          nullable: true
        planned_duration_sec:
          type: integer
          nullable: true
        planned_rest_sec:
          type: integer
          nullable: true
        planned_calories:
          type: integer
        tags:
          type: array
          items:
            type: string
        completed_sets:
          type: integer
        set_results:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutSetView'

    WorkoutSetInput:
      type: object
      required: [set_index, status]
      properties:
        set_index:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [completed, partial, skipped]
        actual_reps:
          type: integer
        actual_duration_sec:
          type: integer

    WorkoutSetView:
      type: object
      properties:
        id:
          type: string
        set_index:
          type: integer
        status:
          type: string
          enum: [completed, partial, skipped]
        actual_reps:
          type: integer
          nullable: true
        actual_duration_sec:
          type: integer
          nullable: true
        is_bonus:
          type: boolean
          description: True when set_index exceeds the parent exercise's planned sets.

    WeightLog:
      type: object
      properties:
        id:
          type: string
        weight_kg:
          type: number
        recorded_at:
          type: string
          format: date-time

    WeightLogInput:
      type: object
      required: [weight_kg]
      properties:
        weight_kg:
          type: number
          minimum: 20
          maximum: 400
        recorded_at:
          type: string
          format: date-time

    MealLog:
      type: object
      properties:
        id:
          type: string
        food_name:
          type: string
        image_url:
