      operationId: sendFriendMessage
      description: |
        BE-191. Sender lấy từ authenticated context. Chỉ gửi được khi vẫn là
        bạn và không bị block ở cả 2 chiều. Idempotent qua `client_message_id`.
        Mỗi tin nhắn có thể chứa nội dung chữ, tối đa 5 ảnh, hoặc cả hai.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer_user_id]
              properties:
                peer_user_id:
                  type: string
                  format: uuid
                  description: "BE-191: thay peer_email (DEC-036). UUID của người nhận."
                text:
                  type: string
                  maxLength: 2000
                image_storage_keys:
                  type: array
                  maxItems: 5
                  uniqueItems: true
                  items:
                    type: string
                client_message_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '403':
          description: "Không phải bạn hoặc đã bị block 1 trong 2 chiều"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: |
            Cùng `client_message_id` nhưng payload khác
            (`FITMATE.CHAT.IDEMPOTENCY_MISMATCH`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /chat/friends/conversations:
    get:
      tags: [Chat]
      summary: Conversations của tôi
      operationId: listConversations
      description: |
        BE-191. Cursor pagination theo (last_message_at desc, id desc).
        `limit` 1..100, default 30. Trả last_message + unread_count cho mỗi
        conversation (count = message do peer gửi sau marker read).
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  nextCursor:
                    type: string
                    nullable: true

  /chat/friends/conversations/{id}:
    get:
      tags: [Chat]
      summary: 1 conversation của tôi
      operationId: getConversation
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          description: Không phải participant hoặc không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /chat/friends/conversations/{id}/messages:
    get:
      tags: [Chat]
      summary: Messages của 1 conversation
      operationId: listFriendMessages
      description: |
        BE-191. Cursor (created_at desc, id desc). `limit` 1..100, default 30.
        Caller phải là participant (404 nếu không — không leak existence).
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
                  nextCursor:
                    type: string
                    nullable: true
        '404':
          description: Không phải participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /chat/friends/conversations/{id}/read:
    post:
      tags: [Chat]
      summary: Đánh dấu đã đọc đến message
      operationId: markFriendMessagesRead
      description: |
        BE-191. Marker read chỉ tiến lên — multi-device không lùi. Caller
        phải là participant và `last_read_message_id` phải thuộc conversation.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      responses:
        '204':
          description: Marked (no-op nếu marker cũ hơn hoặc trùng)
        '400':
          description: last_read_message_id không tồn tại hoặc không thuộc conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Không phải participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /chat/friends/messages/{id}/reactions:
    post:
      tags: [Chat]
      summary: Thả hoặc bỏ cảm xúc trên tin nhắn
      operationId: toggleFriendMessageReaction
      description: |
        Chỉ participant của cuộc trò chuyện được thao tác. Gửi lại cùng cảm xúc
        sẽ bỏ cảm xúc; gửi cảm xúc khác sẽ thay cảm xúc hiện tại của người xem.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reaction]
              properties:
                reaction:
                  type: string
                  enum: ["❤️", "👍", "😂", "😮", "😢"]
      responses:
        '200':
          description: Danh sách tổng hợp cảm xúc mới nhất
          content:
            application/json:
              schema:
                type: object
                required: [items]
