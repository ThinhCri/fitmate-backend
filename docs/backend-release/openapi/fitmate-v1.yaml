                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatReaction'
        '400':
          description: Cảm xúc không được hỗ trợ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Không tìm thấy tin nhắn trong cuộc trò chuyện của caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

