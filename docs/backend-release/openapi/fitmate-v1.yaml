      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Paginated records; new unreviewed appointments are selected from admin bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ManualSettlement'}}
                  total: {type: integer}
                  page: {type: integer}
                  pageSize: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/finance/manual-settlements/{appointmentId}/approve:
    post:
      tags: [Admin]
      operationId: approveManualSettlement
      summary: Record both participant confirmations and approve the server-calculated PT share
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/FinanceTotp'
        - {in: path, name: appointmentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerConfirmedAt, trainerConfirmedAt, sessionEvidenceReference, payeeEvidenceReference, noOpenDisputeConfirmed]
              properties:
                customerConfirmedAt: {type: string, format: date-time, description: UTC after session end}
                trainerConfirmedAt: {type: string, format: date-time, description: UTC after session end}
                sessionEvidenceReference: {type: string, maxLength: 200, description: 'Private case/storage reference, not raw health data'}
                payeeEvidenceReference: {type: string, maxLength: 200}
                noOpenDisputeConfirmed: {type: boolean, enum: [true]}
      responses:
        '200': {$ref: '#/components/responses/ManualSettlementResult'}
        '400': {description: Missing or invalid confirmation/evidence/idempotency key}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Booking/payment not found}
        '409': {description: 'Not completed, pending refund, already paid, or stale financial state'}

  /admin/finance/manual-settlements/{appointmentId}/hold:
    post:
      tags: [Admin]
      operationId: holdManualSettlement
      summary: Suspend an unpaid settlement for dispute or further review
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/FinanceTotp'
        - {in: path, name: appointmentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200': {$ref: '#/components/responses/ManualSettlementResult'}
        '400': {description: Invalid reason}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Booking/payment not found}
        '409': {description: Already paid}

  /admin/finance/manual-settlements/{appointmentId}/record-transfer:
    post:
      tags: [Admin]
      operationId: recordManualSettlementTransfer
      summary: Record an actual manual bank transfer; never calls a payout API
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/FinanceTotp'
        - {in: path, name: appointmentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualTransferRequest'}
      responses:
        '200': {$ref: '#/components/responses/ManualSettlementResult'}
        '400': {description: Missing transfer evidence or idempotency key}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Booking/payment not found}
        '409': {description: 'Missing approval, pending refund, changed amount, reused reference or different existing receipt'}

  /admin/finance/manual-refunds:
    get:
      tags: [Admin]
      operationId: listManualRefunds
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Paginated payOS refunds, camelCase DTO
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ManualRefundView'}}
                  total: {type: integer}
                  page: {type: integer}
                  pageSize: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Admin]
      operationId: requestManualRefund
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/FinanceTotp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentId, amountVnd, reason]
              properties:
                paymentId: {type: string, format: uuid}
                amountVnd: {type: integer, format: int64, minimum: 1}
                reason: {type: string, minLength: 1, maxLength: 500}
                appointmentId: {type: string, format: uuid, nullable: true, description: 'Required for a package payment; identifies the exact session allocation to refund. Omit for a single-session payment.'}
      responses:
        '200': {$ref: '#/components/responses/ManualRefundResult'}
        '400': {description: Invalid request}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Payment not found}
        '409': {description: Refund cap exceeded or wrong payment state/provider}

  /admin/finance/manual-refunds/{refundId}/approve:
    post:
      tags: [Admin]
      operationId: approveManualRefund
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/FinanceTotp'
        - {in: path, name: refundId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/ManualRefundResult'}
        '400': {description: Invalid idempotency key}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Refund not found}
        '409': {description: Refund no longer pending}

  /admin/finance/manual-refunds/{refundId}/record-transfer:
    post:
      tags: [Admin]
      operationId: confirmManualRefundTransfer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/FinanceTotp'
        - {in: path, name: refundId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualTransferRequest'}
      responses:
        '200': {$ref: '#/components/responses/ManualRefundResult'}
        '400': {description: Invalid evidence/time/idempotency key}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Refund not found}
        '409': {description: Reused transfer reference or refund already processed}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    FinanceTotp:
      in: header
      name: X-Finance-Totp
      required: true
      schema: {type: string, pattern: '^[0-9]{6}$'}
      description: Current authenticator code; Admin must have MFA enabled
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
    WeekStartQuery:
      in: query
      name: week_start
      required: false
      description: Ngày thứ Hai mở đầu tuần, mặc định là tuần UTC hiện tại
      schema:
        type: string
        format: date
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ManualSettlementResult:
      description: Durable settlement record; approval is not proof of bank transfer
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManualSettlement'}
    ManualRefundResult:
      description: Durable manual refund record
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManualRefundView'}
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: Forbidden (không đủ quyền)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    AiUsageItem:
      type: object
      required: [limit, used, remaining]
      properties:
        limit: {type: integer, minimum: 0}
        used: {type: integer, minimum: 0}
        remaining: {type: integer, minimum: 0}
    AiSubscriptionStatus:
      type: object
      required: [plan, billing_available, restore_available, product_id, base_plan_id, state, expires_at_utc]
      properties:
        plan: {type: string, enum: [free, plus]}
        billing_available: {type: boolean}
        restore_available: {type: boolean, description: Existing purchases can still be verified after new sales close.}
        product_id: {type: string}
        base_plan_id: {type: string}
        state: {type: string}
        expires_at_utc: {type: string, format: date-time, nullable: true}
    LegacyAppointmentReconciliationView:
      type: object
      properties:
        id: {type: string, format: uuid}
        memberId: {type: string, format: uuid}
        ptUserId: {type: string, format: uuid}
        slotStartUtc: {type: string, format: date-time}
        actualPaidVnd: {type: integer, format: int64}
        platformFeeVnd: {type: integer, format: int64}
        trainerShareVnd: {type: integer, format: int64}
        status: {type: string}
        legacyCompletionTimeUnknown: {type: boolean}
        completedAtUtc: {type: string, format: date-time, nullable: true}
    ManualTransferRequest:
      type: object
      required: [bankReference, evidenceReference, transferredAt]
      properties:
        bankReference: {type: string, minLength: 1, maxLength: 128}
        evidenceReference: {type: string, minLength: 1, maxLength: 200}
        transferredAt: {type: string, format: date-time, description: UTC time from actual bank receipt}
    ManualRefundView:
      type: object
      properties:
        id: {type: string, format: uuid}
        paymentId: {type: string, format: uuid}
        appointmentId: {type: string, format: uuid}
        amountVnd: {type: integer, format: int64}
        reason: {type: string}
        status: {type: integer, enum: [0, 1, 2], description: "Pending=0, Succeeded=1, Failed=2"}
        createdAt: {type: string, format: date-time}
        approvedAtUtc: {type: string, format: date-time, nullable: true}
        transferDueAtUtc: {type: string, format: date-time, nullable: true}
        isOverdue: {type: boolean}
    ManualSettlement:
      type: object
      properties:
        appointmentId: {type: string, format: uuid}
        ptUserId: {type: string, format: uuid}
        paymentId: {type: string, format: uuid}
        status: {type: string, enum: [on_hold, approved, paid]}
        amountVnd: {type: integer, format: int64}
        reviewedBy: {type: string, format: uuid}
        customerConfirmedAt: {type: string, format: date-time, nullable: true}
        trainerConfirmedAt: {type: string, format: date-time, nullable: true}
        approvedAt: {type: string, format: date-time, nullable: true}
        sessionEvidenceReference: {type: string, nullable: true}
        payeeEvidenceReference: {type: string, nullable: true}
        holdReason: {type: string, nullable: true}
        transferredBy: {type: string, format: uuid, nullable: true}
        transferredAt: {type: string, format: date-time, nullable: true}
        bankReference: {type: string, nullable: true}
        transferEvidenceReference: {type: string, nullable: true}
        payeeBankCode: {type: string, nullable: true}
        payeeBankName: {type: string, nullable: true}
        payeeAccountNumber: {type: string, nullable: true}
        payeeAccountName: {type: string, nullable: true}
        payeeVerifiedAtUtc: {type: string, format: date-time, nullable: true}
    PtPayoutAccount:
      type: object
      required: [bank_code, bank_name, account_number, masked_account_number, account_name, verified_at_utc]
      properties:
        bank_code: {type: string, description: Six-digit bank BIN used by the lookup provider}
        bank_name: {type: string}
        account_number: {type: string, description: Owner-only; never expose publicly}
        masked_account_number: {type: string}
        account_name: {type: string}
        verified_at_utc: {type: string, format: date-time}
    ProblemDetails:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: FITMATE.<DOMAIN>.<REASON>
        traceId:
          type: string
          format: uuid
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    RegisterRequest:
      type: object
      required: [email, password, full_name, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        full_name:
          type: string
        role:
          type: string
          enum: [member, pt]
        # member-only
        height_cm:
          type: number
        weight_kg:
          type: number
        gender:
          type: string
          enum: [male, female, other]
        birthday:
          type: string
          format: date
        fitness_goal:
          type: string
        training_days:
          type: array
          items:
            type: string
        # pt-only
        specialty:
          type: string
        experience_years:
          type: integer
          minimum: 0
        price_per_session_vnd:
          type: integer
          minimum: 0
        timezone:
          type: string
          default: Asia/Ho_Chi_Minh

    RegistrationPendingResponse:
      type: object
      required: [verification_required, email, expires_in_seconds]
      properties:
        verification_required:
          type: boolean
          enum: [true]
        email:
          type: string
          format: email
        expires_in_seconds:
          type: integer
          example: 300

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^[0-9]{6}$'

    ResendEmailVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device_label:
          type: string

    AuthResponse:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: seconds
        user:
          $ref: '#/components/schemas/UserSummary'

    DeviceRegistrationResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
          description: Persistent id for this device registration.
        registered_at:
          type: string
          format: date-time
          description: UTC timestamp of registration or last refresh.

    UserSummary:
      type: object
      required: [id, email, full_name, role]
      properties:
        id:
          type: string
        email:
          type: string
        avatar_url:
          type: string
          nullable: true
        full_name:
          type: string
        role:
          type: string
          enum: [member, pt, admin]
        pt_verification_status:
          type: string
          nullable: true
          enum: [pendingdocuments, pendingreview, needsmoreinformation, approved, rejectedfraud]

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        full_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        phone_verified:
          type: boolean
          description: True only after successful SMS ownership verification.
        bio:
          type: string
          nullable: true
          maxLength: 500
        gender:
          type: string
          enum: [male, female, other]
        birthday:
          type: string
          format: date
        height_cm:
          type: number
        weight_kg:
          type: number
        fitness_goal:
          type: string
        training_days:
          type: array
          items:
            type: string
        medical_conditions:
          type: array
          items:
            type: string
        allergies:
          type: array
          items:
            type: string
        preferred_time_slots:
          type: array
          items:
            type: string
        health_notes:
          type: string
          nullable: true
          maxLength: 2000
        timezone:
          type: string
        role:
          type: string
          enum: [member, pt, admin]

    UserProfileUpdate:
      type: object
      properties:
        full_name:
          type: string
        avatar_url:
          type: string
          deprecated: true
        phone:
          type: string
        bio:
          type: string
          maxLength: 500
        gender:
          type: string
          enum: [male, female, other]
        birthday:
          type: string
          format: date
        height_cm:
          type: number
        weight_kg:
          type: number
        fitness_goal:
          type: string
        training_days:
          type: array
          items:
            type: string
        medical_conditions:
          type: array
          items:
            type: string
        allergies:
          type: array
          items:
            type: string
        preferred_time_slots:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 32
        health_notes:
          type: string
          maxLength: 2000
        timezone:
          type: string

    AttachAvatarRequest:
      type: object
      required: [storage_key]
      properties:
        storage_key:
          type: string
          pattern: '^avatars/[0-9a-f]{32}_'

    PublicUserProfile:
      type: object
      required: [id, full_name, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        role:
          type: string
        fitness_goal:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    UserPreferences:
      type: object
      required: [user_id, language, theme, timezone, notifications_enabled, email_notifications, push_notifications, health_data_sharing_consent, biometric_login_enabled, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
        language:
          type: string
        theme:
          type: string
        timezone:
          type: string
        notifications_enabled:
          type: boolean
        email_notifications:
          type: boolean
        push_notifications:
          type: boolean
        health_data_sharing_consent:
          type: boolean
        biometric_login_enabled:
          type: boolean
        target_calories:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10000
        target_protein_g:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000
        target_carbs_g:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000
        target_fat_g:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000
        target_weight_kg:
          type: number
          nullable: true
          minimum: 20
          maximum: 400
        monthly_workout_target:
          type: integer
          nullable: true
          minimum: 1
          maximum: 62
        updated_at:
          type: string
          format: date-time

    UpdateUserPreferencesRequest:
      type: object
      properties:
        language:
          type: string
        theme:
          type: string
        timezone:
          type: string
        notifications_enabled:
          type: boolean
        email_notifications:
          type: boolean
        push_notifications:
          type: boolean
        health_data_sharing_consent:
          type: boolean
        biometric_login_enabled:
          type: boolean
        target_calories: { type: integer, nullable: true, minimum: 1, maximum: 10000 }
        target_protein_g: { type: integer, nullable: true, minimum: 0, maximum: 1000 }
        target_carbs_g: { type: integer, nullable: true, minimum: 0, maximum: 1000 }
        target_fat_g: { type: integer, nullable: true, minimum: 0, maximum: 1000 }
        target_weight_kg: { type: number, nullable: true, minimum: 20, maximum: 400 }
        monthly_workout_target: { type: integer, nullable: true, minimum: 1, maximum: 62 }

    AccountDeletionRequest:
      type: object
      required: [otp]
      properties:
        otp:
          type: string
          pattern: '^[0-9]{6}$'
          description: OTP email bắt buộc, bao gồm DELETE /users/me cũ. Thiếu, sai, hết hạn, đã dùng hoặc vượt 5 lần thử trả 400; nghĩa vụ chưa hoàn tất trả 409.
        reason:
          type: string
          nullable: true
        password:
          type: string
          nullable: true

    AccountDeletionStatus:
      type: object
      required: [user_id, status, is_pending_deletion, retention_days_remaining, has_active_bookings]
      properties:
        user_id:
          type: string
          format: uuid
        status:
          type: string
        is_pending_deletion:
          type: boolean
        requested_at:
          type: string
          format: date-time
          nullable: true
        scheduled_permanent_deletion_at:
          type: string
          format: date-time
          nullable: true
        retention_days_remaining:
          type: integer
        has_active_bookings:
          type: boolean

    AdminDeletionCase:
      type: object
      required: [userId, status]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        fullName:
          type: string
          nullable: true
        status:
          type: string
          enum: [requested, pending_deletion, active]
        requestedAt:
          type: string
          format: date-time
          nullable: true
        deletionStartedAt:
          type: string
          format: date-time
          nullable: true
        deleteAfterUtc:
          type: string
          format: date-time
          nullable: true

    UserDataExport:
      type: object
      required: [user_id, email, full_name, timezone, exported_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        timezone:
          type: string
        profile:
          $ref: '#/components/schemas/UserProfile'
        exported_at:
          type: string
          format: date-time

    PublicAccountDeletionRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        reason:
          type: string
          nullable: true

    PublicAccountDeletionConfirm:
      type: object
      required: [token]
      properties:
        token:
          type: string

    PTPublicProfile:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        avatar_url:
          type: string
        specialty:
          type: string
        experience_years:
          type: integer
        price_per_session_vnd:
          type: integer
        rating:
          type: number
        reviews_count:
          type: integer
        certificate_status:
          type: string
          enum: [verified]

    PTPublicDetail:
      allOf:
