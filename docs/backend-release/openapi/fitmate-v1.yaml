        sender_user_id:
          type: string
          format: uuid
          nullable: true
        sender:
          type: string
          enum: [user, ai, peer]
        text:
          type: string
          maxLength: 2000
        client_message_id:
          type: string
          format: uuid
          nullable: true
          description: "BE-191: idempotency key do client sinh. Unique per conversation."
        created_at:
          type: string
          format: date-time

