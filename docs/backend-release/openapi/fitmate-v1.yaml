      tags: [Bookings]
      summary: Đề xuất dời lịch tập
      description: Tạo yêu cầu dời lịch hẹn giữa Member và PT (Two-Party Consent Branch A).
      operationId: createRescheduleRequest
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRescheduleRequestBody'
      responses:
        '200':
          description: Yêu cầu dời lịch được tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRescheduleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
