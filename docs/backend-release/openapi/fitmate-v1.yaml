  /admin/certificates/trainer/{ptUserId}:
    get:
      tags: [Admin]
      summary: List certificates of one trainer (server-side pagination)
      operationId: adminListTrainerCertificates
      parameters:
        - in: path
          name: ptUserId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          description: 1-based page index. Values below 1 are clamped to 1.
          schema:
            type: integer
            minimum: 1
          default: 1
        - in: query
          name: pageSize
          description: Items per page. Clamped to 1..100 by the server.
          schema:
            type: integer
            minimum: 1
            maximum: 100
          default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Certificate'
                  total:
                    type: integer
                    description: Total rows matching the filter, not the page length.
                  page:
                    type: integer
                  pageSize:
                    type: integer
        '404':
          description: Trainer not found

  /admin/certificates/{id}/preview:
    get:
      tags: [Admin]
      summary: Issue a short-lived signed URL for a certificate image
      description: |
        Ownership is enforced against the recorded uploader, not a storage-key prefix.
        A certificate uploaded before the ownership column existed has no recorded
        uploader and therefore returns 404; it is never attributed automatically.
      operationId: adminPreviewCertificate
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
                  expiresInSeconds:
                    type: integer
                    description: Signed URL TTL (currently 300 seconds).
        '403':
          description: Uploader is recorded but does not own this certificate
        '404':
          description: Certificate not found, has no image key, or has no recorded uploader

  /admin/bookings:
    get:
      tags: [Admin]
