  /chat/friends/messages:
    post:
      tags: [Chat]
      summary: Gửi message cho bạn
      operationId: sendFriendMessage
      description: |
        BE-191. Sender lấy từ authenticated context. Chỉ gửi được khi vẫn là
        bạn và không bị block ở cả 2 chiều. Idempotent qua `client_message_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer_user_id, text]
              properties:
                peer_user_id:
                  type: string
                  format: uuid
                  description: "BE-191: thay peer_email (DEC-036). UUID của người nhận."
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
                client_message_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '403':
          description: "Không phải bạn hoặc đã bị block 1 trong 2 chiều"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: |
            Cùng `client_message_id` nhưng payload khác
            (`FITMATE.CHAT.IDEMPOTENCY_MISMATCH`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

