      description: Endpoint này đã bị bãi bỏ theo DEC-051 và Reschedule Branch A (BR-05). Luôn trả về HTTP 410 Gone. Sử dụng luồng đề xuất đổi lịch qua POST /api/v1/bookings/{id}/reschedule-requests.
      operationId: rescheduleMyBooking
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '410':
          description: Endpoint đã bị bãi bỏ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'


