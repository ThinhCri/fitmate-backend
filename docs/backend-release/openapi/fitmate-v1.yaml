            type: string
            minLength: 1
            maxLength: 32
        is_knowledge:
          type: boolean

    Comment:
      type: object
      required:
        - id
        - post_id
        - author_id
        - author
        - text
        - created_at
        - likes_count
        - liked_by_viewer
      properties:
        id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        parent_comment_id:
          type: string
          format: uuid
          nullable: true
        author:
          $ref: '#/components/schemas/PostAuthor'
        text:
          type: string
        created_at:
          type: string
          format: date-time

        likes_count:
          type: integer
        liked_by_viewer:
          type: boolean

    ChatReaction:
      type: object
      required: [reaction, count, reacted_by_viewer]
      properties:
        reaction:
          type: string
          enum: ["❤️", "👍", "😂", "😮", "😢"]
        count:
          type: integer
          minimum: 1
        reacted_by_viewer:
          type: boolean

    ToggleState:
      type: object
      required: [active, count]
      properties:
        active: {type: boolean}
        count: {type: integer}

    Report:
      type: object
      properties:
        id:
          type: string
        reporter_id:
          type: string
        target_type:
          type: string
          enum: [post, comment, user, certificate]
        target_id:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [pending, resolved, dismissed]
        admin_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ReportInput:
      type: object
      required: [target_type, target_id, reason]
      properties:
        target_type:
          type: string
          enum: [post, comment, user]
        target_id:
          type: string
        reason:
          type: string
          minLength: 5
        details:
          type: string

    FriendRequest:
      type: object
      required:
        - id
        - sender_id
        - recipient_id
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        recipient_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, rejected, cancelled]
        created_at:
          type: string
          format: date-time

    FriendSummary:
      type: object
      required:
        - id
        - display_name
        - friends_since
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        friends_since:
          type: string
          format: date-time

    FriendRelationStatus:
      type: object
      required:
        - relation
      properties:
        relation:
          type: string
          enum: [none, outgoing_pending, incoming_pending, friends, blocked_either]
        request_id:
          type: string
          format: uuid
          nullable: true
        request_created_at:
          type: string
          format: date-time
          nullable: true

    BlockedSummary:
      type: object
      required:
        - id
        - blocked_at
      properties:
        id:
          type: string
          format: uuid
        blocked_at:
          type: string
          format: date-time

    ChatThread:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        last_message_at:
          type: string
          format: date-time
        message_count:
          type: integer

    ChatPeer:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true

    ChatMessage:
      type: object
      required:
        - id
        - sender_user_id
        - sender
        - text
        - created_at
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
          nullable: true
          description: "BE-191: null khi message thuộc AI thread; non-null cho friend chat."
        sender_user_id:
          type: string
          format: uuid
        sender:
          type: string
        text:
          type: string
          maxLength: 2000
        image_urls:
          type: array
          maxItems: 5
          items:
            type: string
            format: uri
        image_storage_keys:
          type: array
          maxItems: 5
          items:
            type: string
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/ChatReaction'
        client_message_id:
          type: string
          format: uuid
          nullable: true
          description: "BE-191: idempotency key do client sinh. Unique per conversation."
        created_at:
          type: string
          format: date-time

    Conversation:
      type: object
      required:
        - conversation_id
        - peer
        - unread_count
        - last_message_at
      properties:
        conversation_id:
          type: string
          format: uuid
        peer:
          $ref: '#/components/schemas/ChatPeer'
        last_message:
          $ref: '#/components/schemas/ChatMessage'
          nullable: true
        unread_count:
          type: integer
        last_message_at:
          type: string
          format: date-time

    MarkReadRequest:
      type: object
      required: [last_read_message_id]
      properties:
        last_read_message_id:
          type: string
          format: uuid

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [friend_request, system, reminder, booking, payment]
        title:
          type: string
          maxLength: 120
        message:
          type: string
          maxLength: 500
        summary:
          type: string
          nullable: true
          description: Short text for lock-screen / push payload (max 120 chars).
        payload:
          type: object
          nullable: true
          additionalProperties: true
          description: Per-type JSON payload. friend_request → {requestId, senderId}; system → {reportId, reason}.
        sourceEventId:
          type: string
          format: uuid
          nullable: true
          description: Domain event id for idempotency dedup.
        sourceType:
          type: string
          nullable: true
          description: 'Source domain: e.g. friend_request_sent, friend_request_accepted, moderation_warning.'
        read:
          type: boolean
        created_at:
          type: string
          format: date-time

    ActionRequired:
      type: object
      required: [pendingCertificates, pendingReports, pendingPayments, recentBookings]
      properties:
        pendingCertificates:
          type: integer
        pendingReports:
          type: integer
        pendingPayments:
          type: integer
        recentBookings:
          type: array
          items:
            $ref: '#/components/schemas/RecentBookingSummary'

    RecentBookingSummary:
      type: object
      required: [appointmentId, memberId, ptUserId, actualPaidVnd, platformFeeVnd, status, createdAt]
      properties:
        appointmentId: {type: string, format: uuid}
        memberId: {type: string, format: uuid}
        ptUserId: {type: string, format: uuid}
        actualPaidVnd: {type: integer, format: int64, description: Integer VND}
        platformFeeVnd: {type: integer, format: int64, description: Integer VND}
        status: {type: string}
        createdAt: {type: string, format: date-time}

    AdminUserSummary:
      type: object
      required: [id, role, isLocked, emailConfirmed, createdAtUtc]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        fullName:
          type: string
          nullable: true
        role:
          type: string
          enum: [Member, PT, Admin]
        isLocked:
          type: boolean
        emailConfirmed:
          type: boolean
        createdAtUtc:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        id:
          type: string
        actor_id:
          type: string
        actor_role:
          type: string
          enum: [member, pt, admin, system]
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        reason:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        id:
          type: string
        from_user_id:
          type: string
        pt_id:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
        created_at:
          type: string
          format: date-time

    PlatformPolicyResponse:
      type: object
      description: |
        Theo DEC-029 — read-only platform policy. Đơn vị platform_fee_rate_bps:
        1000 bps = 10.00%. FE convert sang phần trăm để hiển thị.
      properties:
        platform_fee_rate_bps:
          type: integer
          example: 1000
        policy_version:
          type: string
          example: v1
        effective_from:
          type: string
          format: date-time
        display_hint:
          type: string
          example: "10.00% — cố định, chưa hỗ trợ chỉnh từ admin trong release đầu"
        editable:
          type: boolean
          example: false

    BookingRescheduleEvent:
      type: object
      description: |
        Theo DEC-026 — sự kiện đổi lịch có audit. KHÔNG phải trạng thái kết thúc.
        Booking có previous_booking_id trỏ về event này.
      properties:
        id:
          type: string
        booking_id:
          type: string
        requested_by:
          type: string
        requested_at:
          type: string
          format: date-time
        old_slot_start_utc:
          type: string
          format: date-time
        new_slot_start_utc:
          type: string
          format: date-time
        accepted_by:
          type: string
          nullable: true
        accepted_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [Pending, Accepted, Rejected, Cancelled]
        reason:
          type: string
          nullable: true

    FeatureCapabilityStatus:
      type: object
      required: [enabled, status_reason]
      properties:
        enabled:
          type: boolean
        status_reason:
          type: string

    SystemCapabilitiesResponse:
      type: object
      required:
        - api_version
        - environment
        - ai
        - vip_purchase
        - reward_cashout
        - pt_automatic_payout
        - push_notifications_enabled
        - payments_enabled
        - storage_provider
        - policies
        - contact
      properties:
        api_version:
          type: string
        environment:
          type: string
        ai:
          type: object
          properties:
            enabled: { type: boolean }
            food_scan: { type: boolean }
            companion_chat: { type: boolean }
            workout_adjust: { type: boolean }
            status_reason: { type: string }
        vip_purchase:
          $ref: '#/components/schemas/FeatureCapabilityStatus'
        reward_cashout:
          $ref: '#/components/schemas/FeatureCapabilityStatus'
        pt_automatic_payout:
          $ref: '#/components/schemas/FeatureCapabilityStatus'
        push_notifications_enabled:
          type: boolean
        payments_enabled:
          type: boolean
        storage_provider:
          type: string
        policies:
          type: object
          properties:
            platform_fee_bps: { type: integer }
            min_cancel_hours: { type: integer }
            refund_window_days: { type: integer }
        contact:
          type: object
          properties:
            support_email: { type: string }
            hotline: { type: string }
            terms_url: { type: string }
            privacy_url: { type: string }
            deletion_policy_url: { type: string }

security:
  - bearerAuth: []
