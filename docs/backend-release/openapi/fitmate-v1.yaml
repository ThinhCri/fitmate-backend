      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [friend_request, system, reminder, booking, payment]
        title:
          type: string
          maxLength: 120
        message:
          type: string
          maxLength: 500
        summary:
          type: string
          nullable: true
          description: Short text for lock-screen / push payload (max 120 chars).
        payload:
          type: object
          nullable: true
          additionalProperties: true
          description: Per-type JSON payload. friend_request → {requestId, senderId}; system → {reportId, reason}.
