        workout_name:
          type: string
        duration_minutes:
          type: integer
        target_calories_burn:
          type: integer
        is_completed:
          type: boolean
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/Exercise'

    WorkoutPlanInput:
      type: object
      required: [day_of_week, workout_name, exercises]
      properties:
        day_of_week:
          type: string
        workout_name:
          type: string
        duration_minutes:
          type: integer
        target_calories_burn:
          type: integer
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseInput'

    Exercise:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [reps, time]
        sets:
          type: integer
        reps:
          type: integer
          nullable: true
        duration_sec:
          type: integer
          nullable: true
        rest_sec:
          type: integer
        rest_after_sec:
          type: integer
          nullable: true
        calories:
          type: integer
        notes:
          type: string
        media_url:
          type: string
          nullable: true
        media_type:
          type: string
          enum: [video, audio]
          nullable: true
        media_source:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string

    ExerciseInput:
      type: object
      required: [name, type, sets, rest_sec, calories]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [reps, time]
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
        duration_sec:
          type: integer
        rest_sec:
          type: integer
          minimum: 0
        rest_after_sec:
          type: integer
        calories:
          type: integer
          minimum: 0
        notes:
          type: string
        media_url:
          type: string
        media_type:
          type: string
          enum: [video, audio]
        media_source:
          type: string
        tags:
          type: array
          items:
            type: string

    WorkoutSession:
      type: object
      properties:
        id:
          type: string
        plan_id:
          type: string
          nullable: true
        plan_name:
          type: string
          nullable: true
          description: Snapshot plan name at the time of the session.
        date:
          type: string
          format: date
        day:
          type: string
        duration_min:
          type: integer
        calories_burned:
          type: integer
        exercises:
          type: integer
        status:
          type: string
          enum: [completed, ended_early, skipped]
        completed_sets:
          type: integer
          nullable: true
        planned_sets:
          type: integer
          nullable: true
        snapshot_plan_day_of_week:
          type: string
          nullable: true
        snapshot_plan_planned_duration_minutes:
          type: integer
          nullable: true
        snapshot_plan_target_calories_burn:
          type: integer
