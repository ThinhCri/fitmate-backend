            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 5
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '409':
          description: Booking không thể hủy ở trạng thái hiện tại hoặc hội viên hủy khi còn dưới 48 giờ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

