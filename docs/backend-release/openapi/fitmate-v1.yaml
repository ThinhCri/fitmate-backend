    get:
      tags: [Admin]
      summary: Booking review payload split into appointment, payments and refunds
      description: |
        Returns only the fields the admin review screen is allowed to render.
        Raw payment metadata (gateway charge ids, provider payloads) is never returned.
      operationId: adminBookingReview
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, appointmentStatus, payments, refunds]
                properties:
                  id:
                    type: string
                    format: uuid
                  appointmentStatus:
                    type: string
                    description: Appointment state, independent of payment state.
                  payments:
                    type: array
                    items:
                      type: object
                      required: [id, status, method, amountVnd, refundedVnd, createdAt]
                      properties:
                        id:
                          type: string
                          format: uuid
                        status:
                          type: string
                        method:
                          type: string
                        amountVnd:
                          type: integer
                          format: int64
                          description: Integer VND. No floating point.
                        refundedVnd:
                          type: integer
                          format: int64
                        createdAt:
                          type: string
                          format: date-time
                  refunds:
                    type: array
                    items:
                      type: object
                      required: [id, paymentId, status, amountVnd, reason, createdAt]
                      properties:
                        id:
                          type: string
                          format: uuid
                        paymentId:
                          type: string
                          format: uuid
                        status:
                          type: string
                        amountVnd:
                          type: integer
                          format: int64
                        reason:
                          type: string
                        transferReference:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
        '404':
          description: Booking not found
        '403':
          description: Caller is not an admin

