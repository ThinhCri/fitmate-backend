components:
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: FITMATE.<DOMAIN>.<REASON>
        traceId:
          type: string
          format: uuid
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    RegisterRequest:
      type: object
      required: [email, password, full_name, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        full_name:
          type: string
        role:
          type: string
          enum: [member, pt]
        # member-only
        height_cm:
          type: number
        weight_kg:
          type: number
        gender:
          type: string
          enum: [male, female, other]
        birthday:
          type: string
          format: date
        fitness_goal:
          type: string
        training_days:
          type: array
          items:
            type: string
        # pt-only
        specialty:
          type: string
        experience_years:
          type: integer
          minimum: 0
        price_per_session_vnd:
          type: integer
          minimum: 0
        timezone:
          type: string
          default: Asia/Ho_Chi_Minh

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device_label:
          type: string

    AuthResponse:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: seconds
        user:
          $ref: '#/components/schemas/UserSummary'

    UserSummary:
      type: object
      required: [id, email, full_name, role]
      properties:
        id:
          type: string
        email:
          type: string
        avatar_url:
          type: string
          nullable: true
        full_name:
          type: string
        role:
          type: string
          enum: [member, pt, admin]

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        full_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        gender:
          type: string
          enum: [male, female, other]
        birthday:
          type: string
          format: date
