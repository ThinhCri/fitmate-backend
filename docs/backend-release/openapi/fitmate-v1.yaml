                      $ref: '#/components/schemas/LedgerEntry'
                  total:
                    type: integer

  /admin/finance/legacy-appointments/unverified:
    get:
      tags: [Admin]
      summary: Danh sách lịch hẹn lịch sử chưa đối soát
      operationId: getUnverifiedLegacyAppointments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegacyAppointmentReconciliationView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/finance/legacy-appointments/{id}/verify:
    post:
      tags: [Admin]
      summary: Xác minh và đối soát lịch hẹn lịch sử
      operationId: verifyLegacyAppointment
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/FinanceTotp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verifiedCompletedAtUtc, reason, evidenceReference]
              properties:
                verifiedCompletedAtUtc:
                  type: string
                  format: date-time
                reason:
                  type: string
                  minLength: 5
                evidenceReference:
                  type: string
                  minLength: 3
                  maxLength: 128
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointmentId:
                    type: string
                    format: uuid
                  status:
                    type: string
                  completedAtUtc:
                    type: string
                    format: date-time
                  legacyCompletionTimeUnknown:
                    type: boolean
        '400':
          description: Validation error
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: MFA required or Forbidden
        '404':
          description: Appointment not found
        '409':
          description: Appointment not completed or conflict

  /admin/reports:
    get:
      tags: [Admin]
      summary: Admin list reports
      operationId: adminListReports
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, resolved, dismissed]
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
                  total:
