                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'

  /admin/reports/{id}/dismiss:
    post:
      tags: [Admin]
      summary: Dismiss report
      operationId: adminDismissReport
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'

  /admin/bookings/{id}/review:
    get:
      tags: [Admin]
      summary: Booking review payload split into appointment, payments and refunds
      description: |
        Returns only the fields the admin review screen is allowed to render.
        Raw payment metadata (gateway charge ids, provider payloads) is never returned.
      operationId: adminBookingReview
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, appointmentStatus, payments, refunds]
                properties:
                  id:
                    type: string
                    format: uuid
                  appointmentStatus:
                    type: string
                    description: Appointment state, independent of payment state.
                  payments:
                    type: array
                    items:
                      type: object
                      required: [id, status, method, amountVnd, refundedVnd, createdAt]
                      properties:
                        id:
                          type: string
                          format: uuid
                        status:
                          type: string
                        method:
                          type: string
                        amountVnd:
                          type: integer
                          format: int64
                          description: Integer VND. No floating point.
                        refundedVnd:
                          type: integer
                          format: int64
                        createdAt:
                          type: string
                          format: date-time
                  refunds:
                    type: array
                    items:
                      type: object
                      required: [id, paymentId, status, amountVnd, reason, createdAt]
                      properties:
                        id:
                          type: string
                          format: uuid
                        paymentId:
                          type: string
                          format: uuid
                        status:
                          type: string
                        amountVnd:
                          type: integer
                          format: int64
                        reason:
                          type: string
                        transferReference:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
        '404':
          description: Booking not found
        '403':
          description: Caller is not an admin

  /admin/trainers/{id}/review:
    get:
      tags: [Admin]
      summary: Trainer review payload
      operationId: adminTrainerReview
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  specialty:
                    type: string
                    nullable: true
                  experienceYears:
                    type: integer
                    nullable: true
                  bio:
                    type: string
                    nullable: true
        '404':
          description: Trainer not found
        '403':
          description: Caller is not an admin

  /admin/audit:
    get:
      tags: [Admin]
      summary: Audit log
      operationId: adminListAudit
      parameters:
        - in: query
          name: actorId
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  total:
                    type: integer

  /admin/platform-policy:
    get:
      tags: [Admin]
      summary: Đọc platform policy (read-only theo DEC-029)
      description: |
        Trả chính sách hiện hành của nền tảng. Release đầu KHÔNG có endpoint
        POST để admin sửa (cần audit + versioning + effective_from khi scale).
        Phí nền tảng lưu theo basis points (bps); frontend convert sang %
        cho hiển thị (1000 bps = 10.00%).
      operationId: getPlatformPolicy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformPolicyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/metrics/overview:
    get:
      tags: [Admin]
      summary: Dashboard KPIs (legacy shape compatibility, prefer /admin/finance/overview)
      operationId: adminMetricsOverview
      parameters:
        - in: query
          name: range
          schema:
            type: string
            enum: [7d, 30d, 90d, all]
            default: 30d
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceOverview'

  /admin/action-required:
    get:
      tags: [Admin]
      summary: Tổng hợp cần xử lý
      operationId: adminActionRequired
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionRequired'

  /health/live:
    get:
      tags: [Admin]
      summary: Liveness probe
      operationId: liveness
      security: []
      responses:
        '200':
          description: OK

  /system/capabilities:
    get:
      tags: [System]
      summary: Khảo sát capabilities hệ thống và chính sách công khai (BE-819, BE-829)
      description: |
        Công bố trung thực trạng thái tính năng: AI disabled (BE-817), VIP purchase disabled (BR-17),
        Reward cashout disabled (BR-17), và PT automatic payout disabled (BR-17).
      operationId: getSystemCapabilities
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemCapabilitiesResponse'

  /payments/payos/webhook:
    post:
      tags: [Payments]
      operationId: payosWebhook
      summary: Verify payOS payment signature and settle once
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, signature]
              properties:
                data: {type: object, additionalProperties: true}
                signature: {type: string, minLength: 64, maxLength: 64}
      responses:
        '200': {description: Acknowledged; unknown signed registration probes do not mutate payments}
        '400': {description: Invalid signature or data}
        '409': {description: Order amount or state mismatch; reconcile manually}
        '503': {description: Provider disabled}

  /admin/finance/payments/{paymentId}/provider-status:
    get:
      tags: [Admin]
      operationId: queryPaymentProviderStatus
      summary: Read provider status for reconciliation; never settles from a browser return
      parameters:
        - {in: path, name: paymentId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Provider status only, no financial mutation
          content:
            application/json:
              schema:
                type: object
                properties:
                  isSuccess: {type: boolean}
                  responseCode: {type: string}
                  transactionStatus: {type: string}
                  providerTxnNo: {type: [string, 'null']}
                  message: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Payment not found}
        '503': {description: Original provider not selected or unavailable}

  /admin/finance/manual-settlements:
    get:
      tags: [Admin]
      operationId: listManualSettlements
      summary: Admin-only verification and transfer records (camelCase fields)
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Paginated records; new unreviewed appointments are selected from admin bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ManualSettlement'}}
                  total: {type: integer}
                  page: {type: integer}
                  pageSize: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/finance/manual-settlements/{appointmentId}/approve:
    post:
      tags: [Admin]
      operationId: approveManualSettlement
      summary: Record both participant confirmations and approve the server-calculated PT share
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/FinanceTotp'
        - {in: path, name: appointmentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerConfirmedAt, trainerConfirmedAt, sessionEvidenceReference, payeeEvidenceReference, noOpenDisputeConfirmed]
              properties:
                customerConfirmedAt: {type: string, format: date-time, description: UTC after session end}
                trainerConfirmedAt: {type: string, format: date-time, description: UTC after session end}
                sessionEvidenceReference: {type: string, maxLength: 200, description: Private case/storage reference, not raw health data}
                payeeEvidenceReference: {type: string, maxLength: 200}
                noOpenDisputeConfirmed: {type: boolean, enum: [true]}
      responses:
        '200': {$ref: '#/components/responses/ManualSettlementResult'}
        '400': {description: Missing or invalid confirmation/evidence/idempotency key}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Booking/payment not found}
        '409': {description: Not completed, pending refund, already paid, or stale financial state}

  /admin/finance/manual-settlements/{appointmentId}/hold:
    post:
      tags: [Admin]
      operationId: holdManualSettlement
      summary: Suspend an unpaid settlement for dispute or further review
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/FinanceTotp'
        - {in: path, name: appointmentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200': {$ref: '#/components/responses/ManualSettlementResult'}
        '400': {description: Invalid reason}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Booking/payment not found}
        '409': {description: Already paid}

  /admin/finance/manual-settlements/{appointmentId}/record-transfer:
    post:
      tags: [Admin]
      operationId: recordManualSettlementTransfer
      summary: Record an actual manual bank transfer; never calls a payout API
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/FinanceTotp'
        - {in: path, name: appointmentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualTransferRequest'}
      responses:
        '200': {$ref: '#/components/responses/ManualSettlementResult'}
        '400': {description: Missing transfer evidence or idempotency key}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Booking/payment not found}
        '409': {description: Missing approval, pending refund, changed amount, reused reference or different existing receipt}

  /admin/finance/manual-refunds:
    get:
      tags: [Admin]
      operationId: listManualRefunds
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Paginated payOS refunds, camelCase DTO
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ManualRefundView'}}
                  total: {type: integer}
                  page: {type: integer}
                  pageSize: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Admin]
      operationId: requestManualRefund
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/FinanceTotp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentId, amountVnd, reason]
              properties:
                paymentId: {type: string, format: uuid}
                amountVnd: {type: integer, format: int64, minimum: 1}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200': {$ref: '#/components/responses/ManualRefundResult'}
        '400': {description: Invalid request}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Payment not found}
        '409': {description: Refund cap exceeded or wrong payment state/provider}

  /admin/finance/manual-refunds/{refundId}/record-transfer:
    post:
      tags: [Admin]
      operationId: confirmManualRefundTransfer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/FinanceTotp'
        - {in: path, name: refundId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualTransferRequest'}
      responses:
        '200': {$ref: '#/components/responses/ManualRefundResult'}
        '400': {description: Invalid evidence/time/idempotency key}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Refund not found}
        '409': {description: Reused transfer reference or refund already processed}

components:
  parameters:
    FinanceTotp:
      in: header
      name: X-Finance-Totp
      required: true
      schema: {type: string, pattern: '^[0-9]{6}$'}
      description: Current authenticator code; Admin must have MFA enabled
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ManualSettlementResult:
      description: Durable settlement record; approval is not proof of bank transfer
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManualSettlement'}
    ManualRefundResult:
      description: Durable manual refund record
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManualRefundView'}
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: Forbidden (không đủ quyền)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    LegacyAppointmentReconciliationView:
      type: object
      properties:
        id: {type: string, format: uuid}
        memberId: {type: string, format: uuid}
        ptUserId: {type: string, format: uuid}
        slotStartUtc: {type: string, format: date-time}
        actualPaidVnd: {type: integer, format: int64}
        platformFeeVnd: {type: integer, format: int64}
        trainerShareVnd: {type: integer, format: int64}
        status: {type: string}
        legacyCompletionTimeUnknown: {type: boolean}
        completedAtUtc: {type: string, format: date-time, nullable: true}
    ManualTransferRequest:
      type: object
      required: [bankReference, evidenceReference, transferredAt]
      properties:
        bankReference: {type: string, minLength: 1, maxLength: 128}
        evidenceReference: {type: string, minLength: 1, maxLength: 200}
        transferredAt: {type: string, format: date-time, description: UTC time from actual bank receipt}
    ManualRefundView:
      type: object
      properties:
        id: {type: string, format: uuid}
        paymentId: {type: string, format: uuid}
        appointmentId: {type: string, format: uuid}
        amountVnd: {type: integer, format: int64}
        reason: {type: string}
        status: {type: integer, enum: [0, 1, 2], description: "Pending=0, Succeeded=1, Failed=2"}
        createdAt: {type: string, format: date-time}
    ManualSettlement:
      type: object
      properties:
        appointmentId: {type: string, format: uuid}
        ptUserId: {type: string, format: uuid}
        paymentId: {type: string, format: uuid}
        status: {type: string, enum: [on_hold, approved, paid]}
        amountVnd: {type: integer, format: int64}
        reviewedBy: {type: string, format: uuid}
        customerConfirmedAt: {type: [string, 'null'], format: date-time}
        trainerConfirmedAt: {type: [string, 'null'], format: date-time}
        approvedAt: {type: [string, 'null'], format: date-time}
        sessionEvidenceReference: {type: [string, 'null']}
        payeeEvidenceReference: {type: [string, 'null']}
        holdReason: {type: [string, 'null']}
        transferredBy: {type: [string, 'null'], format: uuid}
        transferredAt: {type: [string, 'null'], format: date-time}
        bankReference: {type: [string, 'null']}
        transferEvidenceReference: {type: [string, 'null']}
    ProblemDetails:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: FITMATE.<DOMAIN>.<REASON>
        traceId:
          type: string
          format: uuid
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    RegisterRequest:
      type: object
      required: [email, password, full_name, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        full_name:
          type: string
        role:
          type: string
          enum: [member, pt]
        # member-only
        height_cm:
          type: number
        weight_kg:
          type: number
        gender:
          type: string
          enum: [male, female, other]
        birthday:
          type: string
          format: date
        fitness_goal:
          type: string
        training_days:
          type: array
          items:
            type: string
        # pt-only
        specialty:
          type: string
        experience_years:
          type: integer
          minimum: 0
        price_per_session_vnd:
          type: integer
          minimum: 0
        timezone:
          type: string
          default: Asia/Ho_Chi_Minh

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device_label:
          type: string

    AuthResponse:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: seconds
        user:
          $ref: '#/components/schemas/UserSummary'

    DeviceRegistrationResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
          description: Persistent id for this device registration.
        registered_at:
          type: string
          format: date-time
          description: UTC timestamp of registration or last refresh.

    UserSummary:
      type: object
      required: [id, email, full_name, role]
      properties:
        id:
          type: string
        email:
          type: string
        avatar_url:
          type: string
          nullable: true
        full_name:
          type: string
        role:
          type: string
          enum: [member, pt, admin]

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        full_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        gender:
          type: string
          enum: [male, female, other]
        birthday:
          type: string
          format: date
        height_cm:
          type: number
        weight_kg:
          type: number
        fitness_goal:
          type: string
        training_days:
          type: array
          items:
            type: string
        medical_conditions:
          type: array
          items:
            type: string
        allergies:
          type: array
          items:
            type: string
        timezone:
          type: string
        role:
          type: string
          enum: [member, pt, admin]

    UserProfileUpdate:
      type: object
      properties:
        full_name:
          type: string
        avatar_url:
          type: string
        phone:
          type: string
        height_cm:
          type: number
        weight_kg:
          type: number
        fitness_goal:
          type: string
        training_days:
          type: array
          items:
            type: string
        medical_conditions:
          type: array
          items:
            type: string
        allergies:
          type: array
          items:
            type: string
        timezone:
          type: string

    PTPublicProfile:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        avatar_url:
          type: string
        specialty:
          type: string
        experience_years:
          type: integer
        price_per_session_vnd:
          type: integer
        rating:
          type: number
        reviews_count:
          type: integer
        certificate_status:
          type: string
          enum: [verified]

    PTPublicDetail:
      allOf:
        - $ref: '#/components/schemas/PTPublicProfile'
        - type: object
          properties:
            bio:
              type: string
            services:
              type: array
              items:
                $ref: '#/components/schemas/Service'
            reviews:
              type: array
              items:
                $ref: '#/components/schemas/Review'

    AvailabilitySlot:
      type: object
      properties:
        id:
          type: string
        slot_start_utc:
          type: string
          format: date-time
        slot_start_local:
          type: string
          format: date-time
        duration_minutes:
          type: integer
        status:
          type: string
          enum: [open, held, booked]

    AvailabilitySlotInput:
      type: object
      required: [slot_start_local, duration_minutes]
      properties:
        slot_start_local:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          minimum: 15
          maximum: 240

    Certificate:
      type: object
      properties:
        id:
          type: string
        pt_id:
          type: string
        title:
          type: string
        issued_by:
          type: string
        code:
          type: string
        issue_date:
          type: string
          format: date
        status:
          type: string
          enum: [pending, approved, rejected]
        image_url:
          type: string
          nullable: true
        reject_reason:
          type: string
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true

    Service:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price_vnd:
          type: integer
        duration_minutes:
          type: integer
        is_active:
          type: boolean

    ServiceInput:
      type: object
      required: [name, price_vnd, duration_minutes]
      properties:
        name:
          type: string
        description:
          type: string
        price_vnd:
          type: integer
          minimum: 0
        duration_minutes:
          type: integer
          minimum: 15
          maximum: 240

    ServiceUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price_vnd:
          type: integer
          minimum: 0
        duration_minutes:
          type: integer
        is_active:
          type: boolean

    BookingHold:
      type: object
      properties:
        id:
          type: string
        pt_id:
          type: string
        service_id:
          type: string
        slot_start_utc:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    AppointmentStatus:
      type: string
      description: |
        Vòng đời của buổi hẹn. Theo DEC-026 — KHÔNG gộp với PaymentStatus hay RefundStatus.
        Enum string ổn định, PascalCase. Client không được PATCH trực tiếp; mỗi transition đi qua endpoint riêng.
      enum: [Held, Pending, Confirmed, InProgress, Completed, Cancelled, Expired]

    PaymentStatus:
      type: string
      description: |
        Vòng đời của payment intent. Tách khỏi AppointmentStatus (DEC-026).
      enum: [Pending, Paid, Failed, Refunded, PartialRefunded]

    RefundStatus:
      type: string
      description: |
        Vòng đời của refund request. Tách khỏi AppointmentStatus (DEC-026).
      enum: [Pending, Succeeded, Failed]

    Appointment:
      type: object
      description: |
        Booking record. Theo DEC-026, tách 3 status:
        - appointment.status: AppointmentStatus
        - appointment.payment_status: PaymentStatus
        - refund.status: RefundStatus
      properties:
        id:
          type: string
        member_id:
          type: string
        pt_id:
          type: string
        service_id:
          type: string
        slot_start_utc:
          type: string
          format: date-time
        slot_start_local:
          type: string
          format: date-time
        duration_minutes:
          type: integer
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'
        is_late_attendee:
          type: boolean
          description: |
            Flag attendance (DEC-026). KHÔNG tự kết luận no-show. KHÔNG dùng để tính reward.
          default: false
        previous_booking_id:
          type: string
          nullable: true
          description: Trỏ tới booking trước nếu được reschedule (audit trail).
        price_listed_vnd:
          type: integer
        discount_vnd:
          type: integer
        actual_paid_vnd:
          type: integer
        platform_fee_rate_bps:
          type: integer
          description: Basis points (1000 = 10.00%). Snapshot tại thời điểm thanh toán.
        platform_fee_vnd:
          type: integer
        trainer_share_vnd:
          type: integer
        policy_version:
          type: string
        payment_id:
          type: string
          nullable: true
        note:
          type: string

    Payment:
      type: object
      properties:
        id:
          type: string
        appointment_id:
          type: string
        method:
          type: string
          description: |
            payos is the selected checkout provider; vnpay remains for historical records.
            An unconfigured or unselected provider returns 503; no mock fallback.
          enum: [vnpay, payos]
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount_vnd:
          type: integer
        redirect_url:
          type: string
          nullable: true
        provider_txn_ref:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    Refund:
      type: object
      properties:
        id:
          type: string
        payment_id:
          type: string
        appointment_id:
          type: string
        amount_vnd:
          type: integer
        reason:
          type: string
        status:
          type: string
          $ref: '#/components/schemas/RefundStatus'
        created_at:
          type: string
          format: date-time

    RevenueSummary:
      type: object
      properties:
        range:
          type: string
          enum: [7d, 30d, 90d, all]
        total_actual_paid_vnd:
          type: integer
        total_platform_fee_vnd:
          type: integer
        total_trainer_share_vnd:
          type: integer
        total_refunded_vnd:
          type: integer
        completed_bookings_count:
          type: integer
        pending_revenue_vnd:
          type: integer
        chart:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              platform_fee_vnd:
                type: integer
              trainer_share_vnd:
                type: integer

    RevenueDetail:
      type: object
      properties:
        booking_id:
          type: string
        actual_paid_vnd:
          type: integer
        platform_fee_vnd:
          type: integer
        trainer_share_vnd:
          type: integer
        refunded_vnd:
          type: integer
        net_trainer_share_vnd:
          type: integer
        status:
          $ref: '#/components/schemas/AppointmentStatus'

    FinanceOverview:
      type: object
      properties:
        range:
          type: string
          enum: [7d, 30d, 90d, all]
        members_total:
          type: integer
        active_pts:
          type: integer
        bookings_in_period:
          type: integer
        gmv_paid_vnd:
          type: integer
        platform_fee_vnd:
          type: integer
        trainer_share_vnd:
          type: integer
        refunded_vnd:
          type: integer
        chart:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              bookings:
                type: integer
              platform_fee_vnd:
                type: integer

    LedgerEntry:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [platform_fee, trainer_share, refund, payout]
        amount_vnd:
          type: integer
        appointment_id:
          type: string
          nullable: true
        payment_id:
          type: string
