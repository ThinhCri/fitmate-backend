      tags: [Payments]
      operationId: payosWebhook
      summary: Verify payOS signature; acknowledge unknown registration probes, settle known orders only when checkout is enabled
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, signature]
              properties:
                data: {type: object, additionalProperties: true}
                signature: {type: string, minLength: 64, maxLength: 64}
      responses:
        '200': {description: Acknowledged; unknown signed registration probes do not mutate payments}
        '400': {description: Invalid signature or data}
        '409': {description: Order amount or state mismatch; reconcile manually}
        '503': {description: "Webhook credentials missing, or known order while checkout is disabled"}

