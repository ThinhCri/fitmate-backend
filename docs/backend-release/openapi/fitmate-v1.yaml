        date:
          type: string
          format: date
        duration_min:
          type: integer
        calories_burned:
          type: integer
        exercises:
          type: integer
        status:
          type: string
          enum: [completed, ended_early, skipped]
        completed_sets:
          type: integer
        planned_sets:
          type: integer
        exercise_items:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutSessionExerciseInput'

    WorkoutSessionDetail:
      type: object
