# === API Backend ===
# File: /etc/nginx/sites-available/fitmate-api
# Replace YOUR_DOMAIN with your actual domain (e.g., fitmate-app.xyz)

server {
    listen 80;
    server_name api.YOUR_DOMAIN;

    # Certbot will add HTTPS redirect automatically after running:
    #   sudo certbot --nginx -d api.YOUR_DOMAIN

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Upload size for food scan images
        client_max_body_size 15M;

        # Timeouts for AI inference (can be slow)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
