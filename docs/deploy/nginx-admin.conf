# === Admin Web (same-origin with Backend) ===
# File: /etc/nginx/sites-available/fitmate-admin
# Replace YOUR_DOMAIN with your actual domain (e.g., fitmate-app.xyz)

server {
    listen 80;
    server_name admin.YOUR_DOMAIN;

    # Certbot will add HTTPS redirect automatically after running:
    #   sudo certbot --nginx -d admin.YOUR_DOMAIN

    # Static files from Vite build
    root /home/fitmate/fitmate/admin-web;
    index index.html;

    # SPA fallback: all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy: /api → backend container
    # This keeps HttpOnly cookies and CSRF working correctly
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15M;
    }

    # Proxy uploaded files
    location /uploads {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
