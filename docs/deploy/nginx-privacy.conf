# === Privacy Policy Page ===
# File: /etc/nginx/sites-available/fitmate-privacy
# Replace YOUR_DOMAIN with your actual domain (e.g., fitmate-app.xyz)
# Hosts the privacy policy + data deletion page required by Google Play

server {
    listen 80;
    server_name YOUR_DOMAIN;

    root /home/fitmate/fitmate/privacy;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
