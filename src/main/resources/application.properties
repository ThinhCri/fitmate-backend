# Spring App Name
spring.application.name=fitmate-backend
server.port=8080

# Supabase PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://db.jjixvvpawzwzppnwrvlf.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
