# Compose override cho local dev.
# Thêm hot reload, debug port, mount source code.

services:
  api:
    # Keep the hot-reload SDK image separate from the production-style runtime
    # image in compose.yml. Reusing fitmate-api:local can retain its ENTRYPOINT
    # and cause the dev command to be parsed as a Fitmate CLI command.
    image: fitmate-api-dev:local
    build:
      dockerfile: src/Fitmate.Api/Dockerfile.dev
    volumes:
      - ./src:/src/src
      # Hide Windows build artifacts from the Linux SDK container. Without
      # these overlays, stale obj files contain backslash paths and make
      # dotnet watch fail while loading static web assets.
      - /src/src/Fitmate.Domain/bin
      - /src/src/Fitmate.Domain/obj
      - /src/src/Fitmate.Application/bin
      - /src/src/Fitmate.Application/obj
      - /src/src/Fitmate.Infrastructure/bin
      - /src/src/Fitmate.Infrastructure/obj
      - /src/src/Fitmate.Api/bin
      - /src/src/Fitmate.Api/obj
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5116
    # Run directly instead of dotnet watch. The watch host resolves the
    # generated static-web-assets path with Windows separators when the source
    # directory is bind-mounted from Windows, which prevents the API starting.
    command: ["dotnet", "run", "--project", "src/Fitmate.Api/Fitmate.Api.csproj", "--urls", "http://+:5116"]
    ports: !override
      # Local development: expose API to a physical phone on the same trusted LAN.
      - "${API_DEV_PORT:-5116}:5116"
